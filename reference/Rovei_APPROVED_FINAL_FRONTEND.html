    const th=theme(),d=state.clientPortal.draft||{},seq=reusableSequence(),idx=state.clientPortal.index;
    let body='';
    if(idx===-1){body=`<div class="client-hero" style="background:${th.primary};color:${th.on};border-radius:25px;padding:38px 30px"><div class="studio-mini">WELCOME TO ${h(state.studio.name||'ROVEI')}</div><h3 style="font-size:clamp(2.5rem,8vw,4.2rem);margin-top:34px">A little prep. A smoother appointment.</h3><p style="font-size:1rem;max-width:560px">Tell us what you’re booking and what feels right for you. We’ll keep the rest simple.</p></div><div style="margin-top:24px"><p class="client-copy" style="color:${th.muted}">Your answers create a private appointment card for ${h(state.studio.name||'the studio')}. Every person who opens this link starts fresh.</p><div class="module-tags" style="margin-top:18px"><span class="tag">Your details</span><span class="tag">Choose a service</span><span class="tag">Your preferences</span></div><button class="btn" id="portalNext" style="margin-top:22px;background:${th.primary};color:${th.on}">Start my appointment ${icon('arrow')}</button><p class="caption" style="margin-top:20px;color:${th.muted}">No account or download required.</p></div>`}
    else if(idx>=seq.length){const c=activeClient();body=`<div class="client-complete"><div class="big-check" style="background:${th.primary}">✓</div><p class="client-kicker" style="color:${th.muted};margin-top:22px">Sent</p><h1 class="client-heading">You’re all set${c?.firstName?', '+h(c.firstName):''}.</h1><p class="client-copy" style="color:${th.muted};max-width:500px;margin:14px auto">${h(state.studio.name||'The studio')} now has your appointment details and intake ready in their dashboard.</p>${clientLinkMode?'<p class="caption" style="color:'+th.muted+';margin-top:20px">You can close this page.</p>':`<button class="btn" id="returnProfessional" style="margin-top:20px;background:${th.primary};color:${th.on}">Back to dashboard ${icon('arrow')}</button>`}</div>`}
    else body=reusableStep(seq[idx],d,th,idx,seq.length);
    const steps=Math.max(seq.length,1);el.innerHTML=`<main class="client-page page-enter" style="${themeUiVars(th)};background:${th.bg};color:${th.text}"><div class="client-shell"><header class="client-brand"><div class="wordmark" style="color:${th.text}">${h(state.studio.name||'Rovei.')}</div><span class="caption" style="color:${th.muted}">${idx<0?'Welcome':idx>=seq.length?'Complete':`${idx+1} of ${seq.length}`}</span></header>${idx>=0&&idx<seq.length?`<div class="portal-progress" style="color:${th.primary};margin-bottom:14px">${Array.from({length:steps},(_,i)=>`<span class="${i<=idx?'on':''}"></span>`).join('')}</div>`:''}<section class="client-card" style="border:1px solid ${mix(th.border,'#ffffff',.45)}">${body}</section></div></main>`;wireReusablePortal(seq,idx,th)
  }

  function renderLegacyClientPortal(){
    const c=portalClient();if(!c){state.screen='app';state.appPage='clients';render();return}const th=theme(),seq=portalSequence(c),idx=state.clientPortal.index,d=state.clientPortal.draft||{};
    let body='';if(idx===-1){body=`<div class="client-hero" style="background:${th.primary};color:${th.on};border-radius:25px;padding:36px 30px"><div class="studio-mini">${h(state.studio.name)}</div><h3 style="font-size:clamp(2.4rem,8vw,4rem);margin-top:35px">Hi ${h(c.firstName)}.</h3><p style="font-size:1rem;max-width:510px">Let’s get you ready for your appointment.</p></div><div style="margin-top:24px"><strong>${h(serviceName(c.service))}</strong><p class="client-copy" style="color:${th.muted}">${h(prettyDate(c.appointmentDate))} · ${h(prettyTime(c.appointmentTime))}</p><p class="client-copy" style="color:${th.muted};margin-top:22px">A few details now means your appointment can start prepared.</p><button class="btn" id="portalNext" style="margin-top:20px;background:${th.primary};color:${th.on}">Get started ${icon('arrow')}</button><p class="caption" style="margin-top:22px;color:${th.muted}">No account or download required.</p></div>`}
    else if(idx>=seq.length){body=`<div class="client-complete"><div class="big-check" style="background:${th.primary}">✓</div><p class="client-kicker" style="color:${th.muted};margin-top:22px">Complete</p><h1 class="client-heading">You’re all set, ${h(c.firstName)}.</h1><p class="client-copy" style="color:${th.muted};max-width:480px;margin:14px auto">Your answers are ready in the professional preview.</p><button class="btn" id="returnProfessional" style="margin-top:20px;background:${th.primary};color:${th.on}">Return to professional view ${icon('arrow')}</button><p class="caption" style="color:${th.muted};margin-top:13px">Founder-review convenience action.</p></div>`}
    else body=portalModule(seq[idx],c,d,th,idx,seq.length);
    const steps=Math.max(seq.length,1);el.innerHTML=`<main class="client-page page-enter" style="${themeUiVars(th)};background:${th.bg};color:${th.text}"><div class="client-shell"><header class="client-brand"><div class="wordmark" style="color:${th.text}">${h(state.studio.name||'Rovei.')}</div><span class="caption" style="color:${th.muted}">${idx<0?'Welcome':idx>=seq.length?'Complete':`${idx+1} of ${seq.length}`}</span></header>${idx>=0&&idx<seq.length?`<div class="portal-progress" style="color:${th.primary};margin-bottom:14px">${Array.from({length:steps},(_,i)=>`<span class="${i<=idx?'on':''}"></span>`).join('')}</div>`:''}<section class="client-card" style="border:1px solid ${mix(th.border,'#ffffff',.45)}">${body}</section></div></main>`;
    wirePortal(c,seq,idx,th)
  }

  function reusableActions(th,idx,total,nextLabel='Continue'){return `<div class="client-actions"><button class="btn secondary" id="portalBack" style="color:${th.primary};border-color:${th.border}">${icon('back')} Back</button><button class="btn" id="portalNext" style="background:${th.primary};color:${th.on}">${nextLabel} ${icon('arrow')}</button></div>`}
  function reusableStep(id,d,th,idx,total){
    if(id==='identity')return `<p class="client-kicker" style="color:${th.muted}">About you</p><h1 class="client-heading">First, who are we getting ready for?</h1><p class="client-copy" style="color:${th.muted}">These details create your own private appointment card. Nothing from another client is carried into this form.</p><div class="form-stack" style="margin-top:24px"><div class="field"><label for="intakeFirst">First name</label><input class="input" id="intakeFirst" value="${h(d.firstName||'')}" autocomplete="given-name"></div><div class="field"><label for="intakeLast">Last name</label><input class="input" id="intakeLast" value="${h(d.lastName||'')}" autocomplete="family-name"></div></div>${reusableActions(th,idx,total)}`;
    if(id==='booking'){const packLocked=!!state.clientPortal.packId,slots=availableBookingSlots(d.appointmentDate),selected=slots.includes(d.appointmentTime)?d.appointmentTime:'';return `<p class="client-kicker" style="color:${th.muted}">Your appointment</p><h1 class="client-heading">What are you coming in for?</h1><p class="client-copy" style="color:${th.muted}">Choose your service and one of the studio’s currently available appointment times.</p><div class="form-stack" style="margin-top:24px"><div class="field"><label for="intakeService">Service</label><select class="select" id="intakeService" ${packLocked?'disabled':''}><option value="">Choose a service</option>${state.studio.services.map(id=>`<option value="${id}" ${d.service===id?'selected':''}>${h(serviceName(id))}</option>`).join('')}</select>${packLocked?`<span class="help">Previewing the ${h(state.beautyPacks.find(p=>p.id===state.clientPortal.packId)?.name||'Beauty Pack')} template.</span>`:'<span class="help">Rovei automatically applies the matching Beauty Pack after you choose.</span>'}</div><div class="field"><label for="intakeDate">Appointment date</label><input class="input" id="intakeDate" type="date" min="${todayISO()}" value="${h(d.appointmentDate||'')}"><span class="help">Only your working days will offer appointment times.</span></div><div class="field"><label for="intakeTime">Available time</label><select class="select" id="intakeTime" ${slots.length?'':'disabled'}>${bookingTimeOptions(d.appointmentDate,selected)}</select><span class="help" id="availabilityHint">${availabilityHint(d.appointmentDate)}</span></div></div>${reusableActions(th,idx,total)}`}
    if(id==='review'){const pack=beautyPackForService(d.service);return `<p class="client-kicker" style="color:${th.muted}">Ready to send</p><h1 class="client-heading">One last look.</h1><p class="client-copy" style="color:${th.muted}">Submit this and ${h(state.studio.name||'the studio')} will see your appointment in their dashboard.</p><div style="margin-top:24px;border:1px solid ${th.border};border-radius:20px;padding:19px;background:${th.bg}"><div class="data-row"><div class="k">Client</div><div class="v">${h((d.firstName||'')+' '+(d.lastName||''))}</div></div><div class="data-row"><div class="k">Appointment</div><div class="v">${h(serviceName(d.service))} · ${h(prettyDate(d.appointmentDate))} · ${h(prettyTime(d.appointmentTime))}</div></div><div class="data-row"><div class="k">Experience</div><div class="v">${h(pack?.name||'Studio client experience')}</div></div></div>${reusableActions(th,idx,total,'Submit to studio')}`}
    const pseudo={id:state.clientPortal.sessionId,firstName:d.firstName||'Client',service:d.service,appointmentDate:d.appointmentDate,appointmentTime:d.appointmentTime};return portalModule(id,pseudo,d,th,idx,total)
  }
  function saveReusableStep(id,validate=false){
    const d=state.clientPortal.draft||{};
    if(id==='identity'){
      d.firstName=document.getElementById('intakeFirst')?.value||'';
      d.lastName=document.getElementById('intakeLast')?.value||'';
      if(validate&&(!d.firstName.trim()||!d.lastName.trim())){toast('Add your first and last name to continue.');return false}
    }else if(id==='booking'){
      if(!state.clientPortal.packId)d.service=document.getElementById('intakeService')?.value||'';
      d.appointmentDate=document.getElementById('intakeDate')?.value||'';
      d.appointmentTime=document.getElementById('intakeTime')?.value||'';
      if(validate&&(!d.service||!d.appointmentDate||!d.appointmentTime)){toast('Choose a service, available date and time to continue.');return false}
      if(validate&&!isWorkingDate(d.appointmentDate)){toast('That date is outside the studio’s working days. Choose another date.');return false}
      if(validate&&!isBookableSlot(d.appointmentDate,d.appointmentTime)){toast('That appointment time is no longer available. Choose another time.');return false}
    }else if(MODULES.some(m=>m.id===id)){
      state.clientPortal.draft=d;
      return savePortalFields(id,validate)
    }
    state.clientPortal.draft=d;persist();return true
  }

  function submitReusableIntake(){
    const d=state.clientPortal.draft||{},modules=intakeModules(d.service,state.clientPortal.packId);
    if(!d.firstName?.trim()||!d.lastName?.trim()||!d.service||!d.appointmentDate||!d.appointmentTime){toast('Your booking details are incomplete.');return false}
    if(!isBookableSlot(d.appointmentDate,d.appointmentTime)){
      state.clientPortal.index=1;persist();toast('That time was just taken or is no longer available. Please choose another appointment time.');renderClientPortal();return false
    }
    const id='client_'+Date.now().toString(36)+'_'+randomToken(5);
    const c={id,firstName:d.firstName.trim(),lastName:d.lastName.trim(),service:d.service,appointmentDate:d.appointmentDate,appointmentTime:d.appointmentTime,token:'submission_'+randomToken(18),status:'READY',modules:[...modules],response:{consultation:d.consultation||'',finish:d.finish||'',feel:d.feel||'',consent:!!d.consent,prep:!!d.prep},source:'reusable-link',createdAt:new Date().toISOString()};
    state.clients.push(c);state.activeClientId=id;
    if(memory.clientPhotos[state.clientPortal.sessionId]){memory.clientPhotos[id]=memory.clientPhotos[state.clientPortal.sessionId];delete memory.clientPhotos[state.clientPortal.sessionId]}
    state.clientPortal.clientId=id;state.clientPortal.index=reusableSequence().length;persist();return true
  }

  function wireReusablePortal(seq,idx,th){
    const next=document.getElementById('portalNext'),back=document.getElementById('portalBack');
    if(idx===-1){if(next)next.onclick=()=>{state.clientPortal.index=0;persist();renderClientPortal()};return}
    if(idx>=seq.length){const ret=document.getElementById('returnProfessional');if(ret)ret.onclick=()=>{clientLinkMode=false;location.hash='';state.screen='app';state.appPage='client-detail';persist();render()};return}
    const id=seq[idx];
    if(id==='booking'){
      const d=state.clientPortal.draft||{},dateEl=document.getElementById('intakeDate'),timeEl=document.getElementById('intakeTime'),hintEl=document.getElementById('availabilityHint'),serviceEl=document.getElementById('intakeService');
      const refreshSlots=()=>{
        const date=dateEl?.value||'',previous=timeEl?.value||d.appointmentTime||'',slots=availableBookingSlots(date);
        if(timeEl){timeEl.innerHTML=bookingTimeOptions(date,slots.includes(previous)?previous:'');timeEl.disabled=!slots.length;if(slots.includes(previous))timeEl.value=previous}
        if(hintEl)hintEl.textContent=availabilityHint(date);
      };
      if(serviceEl)serviceEl.onchange=()=>{d.service=serviceEl.value;state.clientPortal.draft=d;persist()};
      if(dateEl)dateEl.onchange=()=>{d.appointmentDate=dateEl.value;d.appointmentTime='';state.clientPortal.draft=d;persist();refreshSlots()};
      if(timeEl)timeEl.onchange=()=>{d.appointmentTime=timeEl.value;state.clientPortal.draft=d;persist()};
      refreshSlots();
    }
    if(id==='inspiration'||id==='current-photos')bindPhotoInput('portalPhotos',state.clientPortal.sessionId,id,'portalPhotoPreview',memory.clientPhotos);
    if(id==='consent'){const b=document.getElementById('viewConsentInfo');if(b)b.onclick=()=>showClientInfo('Appointment consent information',`<p>This acknowledgement confirms that you have read the studio’s appointment information, that the details you provide are accurate to the best of your knowledge, and that you will contact ${h(state.studio.name||'the studio')} if anything about the appointment needs clarification.</p><p class="caption">Prototype wording only — a live studio should replace this with its own approved consent, cancellation and service-policy language where required.</p>`,th)}
    if(id==='prep'){const b=document.getElementById('viewPrepInfo');if(b)b.onclick=()=>showClientInfo('Preparation guidance',`<p>Arrive with the appointment area clean and free of products where practical. Give yourself enough time to arrive comfortably, bring any inspiration you want to discuss, and contact ${h(state.studio.name||'the studio')} before the appointment if you are unsure how to prepare.</p>`,th)}
    if(back)back.onclick=()=>{saveReusableStep(id);state.clientPortal.index=Math.max(-1,idx-1);persist();renderClientPortal()};
    if(next)next.onclick=()=>{if(id==='review'){if(submitReusableIntake())renderClientPortal();return}if(!saveReusableStep(id,true))return;state.clientPortal.index=idx+1;persist();renderClientPortal()}
  }

  function showClientInfo(title,html,th=theme()){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal page-enter" role="dialog" aria-modal="true" aria-labelledby="clientInfoTitle" style="border-color:${mix(th.border,'#ffffff',.35)}"><p class="eyebrow" style="color:${th.primary}">Please read</p><h3 id="clientInfoTitle" style="margin-top:10px">${h(title)}</h3><div class="body" style="margin-top:14px;color:${th.muted}">${html}</div><div class="modal-actions"><button class="btn" id="closeClientInfo" style="background:${th.primary};color:${th.on}">Got it</button></div></div></div>`;document.getElementById('closeClientInfo').onclick=()=>modalRoot.innerHTML=''}

  function portalModule(id,c,d,th,idx,total){
    const actions=`<div class="client-actions"><button class="btn secondary" id="portalBack" style="color:${th.primary};border-color:${th.border}">${icon('back')} Back</button><button class="btn" id="portalNext" style="background:${th.primary};color:${th.on}">${idx===total-1?'Review & submit':'Continue'} ${icon('arrow')}</button></div>`;
    if(id==='consultation')return `<p class="client-kicker" style="color:${th.muted}">Consultation</p><h1 class="client-heading">What would you like from this appointment?</h1><p class="client-copy" style="color:${th.muted}">Tell your professional about the look, finish or result you’re hoping for.</p><div class="field" style="margin-top:24px"><label for="portalConsult">Your goal</label><textarea class="textarea" id="portalConsult" maxlength="500" placeholder="Tell us the look, finish or result you're hoping for...">${h(d.consultation||'')}</textarea><span class="help" style="color:${th.muted}">Beauty goals only — no medical information is needed.</span></div>${actions}`;
    if(id==='preferences')return `<p class="client-kicker" style="color:${th.muted}">Your preferences</p><h1 class="client-heading">A little about what feels right.</h1><p class="client-copy" style="color:${th.muted}">These preferences help your professional understand your style and the kind of appointment you enjoy.</p><div style="margin-top:24px"><div class="field-label">Preferred finish</div><div class="portal-options">${[['natural','Natural'],['soft','Soft'],['defined','Defined'],['glam','Glam'],['not-sure','Not sure yet']].map(([v,l])=>portalRadio('finish',v,l,d.finish,th)).join('')}</div></div><div style="margin-top:25px"><div class="field-label">How do you like your appointments to feel?</div><div class="portal-options">${[['quiet','Quiet & relaxed'],['chatty','Happy to chat'],['no-preference','No preference']].map(([v,l])=>portalRadio('feel',v,l,d.feel,th)).join('')}</div></div>${actions}`;
    if(id==='inspiration'||id==='current-photos'){const label=id==='inspiration'?'Inspiration photos':'Current photos';const copy=id==='inspiration'?'Share any reference images that capture the look you have in mind.':'Share current-condition photos if they will help your professional prepare.';const photos=(memory.clientPhotos[c.id]||{})[id]||[];return `<p class="client-kicker" style="color:${th.muted}">${h(label)}</p><h1 class="client-heading">${id==='inspiration'?'Show us what you love.':'A quick look before you arrive.'}</h1><p class="client-copy" style="color:${th.muted}">${h(copy)}</p><div class="file-box" style="margin-top:24px;border-color:${th.border};background:${th.bg}"><input id="portalPhotos" type="file" accept="image/*" multiple><p class="help" style="color:${th.muted}">Local preview only. No upload or sync is claimed.</p><div class="photo-preview" id="portalPhotoPreview">${photoThumbs(photos)}</div></div>${actions}`}
    if(id==='consent')return `<p class="client-kicker" style="color:${th.muted}">Consent</p><h1 class="client-heading">A simple acknowledgement.</h1><p class="client-copy" style="color:${th.muted}">This prototype uses a lightweight acknowledgement rather than legal or medical form logic.</p><label class="checkrow" style="margin-top:26px;border:1px solid ${th.border};border-radius:17px;padding:16px"><input id="portalConsent" type="checkbox" ${d.consent?'checked':''}><span class="client-copy">I acknowledge the studio’s <button type="button" class="inline-disclosure" id="viewConsentInfo">appointment consent information</button>.</span></label>${actions}`;
    if(id==='prep')return `<p class="client-kicker" style="color:${th.muted}">Prep</p><h1 class="client-heading">Arrive ready.</h1><p class="client-copy" style="color:${th.muted}">Please arrive with the appointment area clean and free of products where practical. If you’re unsure about preparation, contact ${h(state.studio.name)} directly.</p><div style="margin-top:22px;border-radius:18px;background:${th.bg};padding:18px;border:1px solid ${th.border}"><strong style="font-size:.83rem">Preparation note</strong><p class="client-copy" style="color:${th.muted};margin-bottom:0">Give yourself enough time to arrive comfortably. Bring any inspiration you want to discuss.</p></div><label class="checkrow" style="margin-top:20px"><input id="portalPrep" type="checkbox" ${d.prep?'checked':''}><span class="client-copy">I’ve read the <button type="button" class="inline-disclosure" id="viewPrepInfo">preparation guidance</button>.</span></label>${actions}`;
    return actions
  }
  function portalRadio(name,v,l,current,th){const sel=current===v;return `<label class="portal-option" style="border-color:${sel?th.primary:th.border};background:${sel?th.secondary:th.surface};color:${th.text}"><input type="radio" name="${name}" value="${v}" ${sel?'checked':''}><span>${l}</span></label>`}

  function wirePortal(c,seq,idx,th){
    const next=document.getElementById('portalNext'),back=document.getElementById('portalBack');if(idx===-1){next.onclick=()=>{state.clientPortal.index=0;persist();renderClientPortal()};return}if(idx>=seq.length){document.getElementById('returnProfessional').onclick=()=>{state.screen='app';state.activeClientId=c.id;state.appPage='client-detail';persist();render()};return}
    const id=seq[idx];if(id==='inspiration'||id==='current-photos')bindPhotoInput('portalPhotos',c.id,id,'portalPhotoPreview',memory.clientPhotos);
    if(id==='consent'){const b=document.getElementById('viewConsentInfo');if(b)b.onclick=()=>showClientInfo('Appointment consent information',`<p>This acknowledgement confirms that you have read the studio’s appointment information and will contact ${h(state.studio.name||'the studio')} if anything needs clarification.</p><p class="caption">Prototype wording only — replace with your studio’s approved policy or consent wording in production.</p>`,th)}
    if(id==='prep'){const b=document.getElementById('viewPrepInfo');if(b)b.onclick=()=>showClientInfo('Preparation guidance',`<p>Arrive with the appointment area clean and free of products where practical. Give yourself enough time to arrive comfortably, bring any inspiration you want to discuss, and contact ${h(state.studio.name||'the studio')} if you are unsure how to prepare.</p>`,th)}
    if(back)back.onclick=()=>{savePortalFields(id);state.clientPortal.index=Math.max(-1,idx-1);persist();renderClientPortal()};
    if(next)next.onclick=()=>{if(!savePortalFields(id,true))return;if(idx===seq.length-1){const clientIdx=state.clients.findIndex(x=>x.id===c.id);state.clients[clientIdx].response={...state.clientPortal.draft};state.clients[clientIdx].status='READY';state.clientPortal.index=seq.length;persist();renderClientPortal()}else{state.clientPortal.index=idx+1;persist();renderClientPortal()}};
  }
  function savePortalFields(id,validate=false){const d=state.clientPortal.draft||{};if(id==='consultation'){d.consultation=document.getElementById('portalConsult').value;if(validate&&!d.consultation.trim()){toast('Tell us what you’d like from the appointment.');return false}}if(id==='preferences'){d.finish=document.querySelector('input[name="finish"]:checked')?.value||'';d.feel=document.querySelector('input[name="feel"]:checked')?.value||'';if(validate&&(!d.finish||!d.feel)){toast('Choose one option in each preference group.');return false}}if(id==='consent'){d.consent=document.getElementById('portalConsent').checked;if(validate&&!d.consent){toast('Acknowledge consent to continue.');return false}}if(id==='prep'){d.prep=document.getElementById('portalPrep').checked;if(validate&&!d.prep){toast('Confirm that you read the prep guidance.');return false}}state.clientPortal.draft=d;persist();return true}


  function render(){
    resetButtonVisible();window.scrollTo(0,0);switch(state.screen){case 'landing':renderLanding();break;case 'welcome':renderWelcome();break;case 'studio':renderStudioName();break;case 'services':renderServices();break;case 'mood':renderMood();break;case 'experience':renderExperience();break;case 'preview':renderPreview();break;case 'signup':renderSignup();break;case 'activation':renderActivation();break;case 'checkout':renderCheckout();break;case 'first-run':renderFirstRun();break;case 'app':renderApp();break;case 'client':renderClientPortal();break;case 'visit':renderVisit();break;default:state=freshState();persist();renderLanding()}
  }

  window.addEventListener('hashchange',()=>{if(openPortalFromHash())render()});
  window.addEventListener('storage',e=>{if(e.key!==KEY)return;if(clientLinkMode&&state.screen==='client'){const latest=load();state.clients=latest.clients||[];state.settings=latest.settings;state.studio=latest.studio;state.beautyPacks=latest.beautyPacks||[];state.clientLinkToken=latest.clientLinkToken||state.clientLinkToken;return}const currentScreen=state.screen,currentPage=state.appPage;state=load();if(currentScreen==='app'){state.screen='app';state.appPage=currentPage}render()});
  openPortalFromHash();
  render();
})();

</script>
</body>
</html>

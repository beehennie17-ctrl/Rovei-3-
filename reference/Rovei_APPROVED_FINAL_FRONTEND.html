/* =========================================================
   ROVEI VISUAL BRAND REFINEMENT — FRESH-START PREVIEW ONLY
   Luxury cosmetic packaging × editorial beauty × calm software
   ========================================================= */

:root{
  --wine:#941651;
  --wine-deep:#3D0915;
  --wine-mid:#6A1629;
  --blush:#E7BDC3;
  --rose:#EECBD1;
  --mauve:#D2C5CE;
  --cream:#FFFDFC;
  --rose-wash:#F7E9EC;
  --soft:#FBF5F6;
  --sidebar:#941651;
  --text:#24191D;
  --muted:#75636A;
  --border:#E8D6DC;
  --surface:#FFFDFD;
  --shadow-soft:0 24px 68px rgba(148,22,81,.11);
  --shadow-card:0 14px 36px rgba(98,55,70,.085);
  --sans:"Manrope",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,"Times New Roman",serif;
}

html,body{background:var(--soft)}
body{font-family:var(--sans);font-weight:450;letter-spacing:-.008em}
.display,.page-title,.section-title,.wordmark,.choice-title,.price-big{font-family:var(--sans)}
.display{font-weight:760;letter-spacing:-.068em}
.page-title{font-weight:730;letter-spacing:-.048em}
.section-title{font-weight:720}
.editorial,.serif,.detail-name,.client-heading,.client-hero h3{font-family:var(--serif);font-weight:600}
.editorial{font-style:italic;letter-spacing:-.035em}
.body{color:var(--muted)}
.eyebrow{letter-spacing:.17em;font-size:.69rem}
.wordmark{font-weight:800;letter-spacing:-.055em}

/* Shared tactile surface + control system */
.card{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow-card)}
.card.pad{padding:clamp(22px,3vw,31px)}
.card.dashed{background:linear-gradient(145deg,#fffdfd 0%,#fbf1f3 100%);border-color:#DDBBC3}
.btn{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--wine-mid),var(--wine));box-shadow:0 9px 22px rgba(148,22,81,.14);letter-spacing:-.01em}
.btn:hover{background:linear-gradient(180deg,#741A30,var(--wine-mid));box-shadow:0 12px 26px rgba(148,22,81,.18)}
.btn::after{content:"";position:absolute;inset:-45% auto -45% -22%;width:26%;transform:skewX(-20deg) translateX(-180%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transition:transform .65s ease;pointer-events:none}
.btn:hover::after{transform:skewX(-20deg) translateX(560%)}
.btn.secondary{background:linear-gradient(180deg,#fff,#fff9fa);border-color:#E0C8CF;color:var(--wine);box-shadow:0 6px 18px rgba(148,22,81,.05)}
.btn.secondary:hover,.btn.ghost:hover{background:var(--rose-wash);border-color:var(--blush)}
.input,.select,.textarea{background:var(--cream);border-color:#DFC9D0;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.input:hover,.select:hover,.textarea:hover{border-color:#CFA1AD}
.input:focus,.select:focus,.textarea:focus{border-color:var(--wine);box-shadow:0 0 0 4px rgba(231,189,195,.32);outline:none}
.tag{background:#F6E8EB;color:var(--wine);border:1px solid rgba(148,22,81,.05)}
.swatch{box-shadow:0 0 0 4px rgba(231,189,195,.18)}

/* Reusable cosmetic detail system */
.sparkle,.sparkle-sm,.sparkle-lg{position:absolute;display:block;width:6px;height:6px;pointer-events:none;opacity:.55}
.sparkle::before,.sparkle::after,.sparkle-sm::before,.sparkle-sm::after,.sparkle-lg::before,.sparkle-lg::after{content:"";position:absolute;left:50%;top:50%;background:currentColor;border-radius:99px;transform:translate(-50%,-50%)}
.sparkle::before,.sparkle-sm::before,.sparkle-lg::before{width:1px;height:100%}
.sparkle::after,.sparkle-sm::after,.sparkle-lg::after{width:100%;height:1px}
.sparkle-sm{width:4px;height:4px}.sparkle-lg{width:9px;height:9px}
.sparkle-cluster{position:absolute;pointer-events:none}
.shimmer-dust,.soft-grain{position:relative;isolation:isolate}
.shimmer-dust::after,.soft-grain::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 22% 18%,rgba(255,255,255,.55) 0 1px,transparent 1.4px),radial-gradient(circle at 74% 38%,rgba(231,189,195,.45) 0 1px,transparent 1.3px),radial-gradient(circle at 42% 78%,rgba(238,203,209,.38) 0 1px,transparent 1.2px);background-size:41px 41px,57px 57px,73px 73px;opacity:.32}
.cosmetic-sheen{position:relative;overflow:hidden;isolation:isolate}
.cosmetic-sheen::after{content:"";position:absolute;inset:-40% -70%;background:linear-gradient(108deg,transparent 42%,rgba(255,255,255,.24) 49%,transparent 56%);transform:translateX(-35%);animation:roveiSheen 9s ease-in-out infinite;pointer-events:none}
.rose-glow{box-shadow:0 25px 75px rgba(148,22,81,.12),0 0 0 1px rgba(231,189,195,.28)}
@keyframes roveiTwinkle{0%,82%,100%{opacity:.24;transform:scale(.8)}89%{opacity:.7;transform:scale(1.12)}95%{opacity:.38;transform:scale(.9)}}
@keyframes roveiSheen{0%,76%,100%{transform:translateX(-35%);opacity:0}82%{opacity:.75}92%{transform:translateX(35%);opacity:0}}

/* Welcome / founder entrance */
.welcome{background:radial-gradient(circle at 80% 14%,rgba(231,189,195,.58),transparent 28%),radial-gradient(circle at 12% 88%,rgba(238,203,209,.48),transparent 31%),linear-gradient(140deg,#fffdfc 0%,#fff 48%,#fbf2f4 100%)}
.welcome::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 75% 27%,rgba(148,22,81,.13) 0 1px,transparent 1.4px),radial-gradient(circle at 92% 45%,rgba(148,22,81,.09) 0 1px,transparent 1.3px),radial-gradient(circle at 62% 9%,rgba(255,255,255,.9) 0 1.2px,transparent 1.6px);background-size:68px 68px,94px 94px,53px 53px;opacity:.35;pointer-events:none}
.welcome-copy{position:relative;z-index:2}
.welcome-copy .display{max-width:900px}
.welcome-copy p:not(.eyebrow){color:#6F5A62}
.welcome-art{isolation:isolate}
.welcome-art::before,.welcome-art::after{content:"";position:absolute;pointer-events:none;z-index:4;width:8px;height:8px;background:linear-gradient(90deg,transparent 45%,rgba(148,22,81,.38) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(148,22,81,.38) 47% 53%,transparent 55%);animation:roveiTwinkle 8s ease-in-out infinite}
.welcome-art::before{left:13%;top:20%}.welcome-art::after{right:4%;bottom:18%;animation-delay:2.7s;transform:scale(.7)}
.arch-card{border-color:#7C2D3E;border-radius:190px 190px 30px 30px;background:var(--cream);box-shadow:0 32px 80px rgba(148,22,81,.18),0 0 0 8px rgba(255,255,255,.45);overflow:hidden}
.arch-top{background:linear-gradient(168deg,#6B1830 0%,var(--wine) 58%,var(--wine-deep) 100%)}
.arch-top::before{content:"";position:absolute;inset:-55% -30%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.16) 49%,transparent 56%);transform:translateX(-38%);animation:roveiSheen 10s ease-in-out infinite;pointer-events:none}
.arch-bottom{background:linear-gradient(180deg,#fff 0%,#fffaf9 100%);border-top:1px solid rgba(231,189,195,.42)}
.arch-line{background:#F0DEE2}.pill.ready{background:#EAF2EC;color:#506C5A}
.float-note{background:rgba(255,253,252,.96);border-color:#E1C8CF;box-shadow:0 22px 55px rgba(148,22,81,.13)}

/* Onboarding split: calm editor + beauty-campaign preview */
.split{background:var(--cream)}
.split-main{background:linear-gradient(180deg,#fffdfc 0%,#fff 52%,#fffafa 100%)}
.split-preview{--preview-tint-a:#F4DDE2;--preview-tint-b:#EAC6CE;--preview-tint-c:#F7E9EC;--preview-glow:rgba(255,255,255,.45);--preview-sparkle-rgb:148,22,81;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.82),transparent 25%),radial-gradient(circle at 16% 15%,var(--preview-glow),transparent 18%),linear-gradient(145deg,var(--preview-tint-a) 0%,var(--preview-tint-b) 48%,var(--preview-tint-c) 100%);transition:background .28s ease}
.split-preview::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 22%,rgba(255,255,255,.82) 0 1px,transparent 1.5px),radial-gradient(circle at 79% 28%,rgba(var(--preview-sparkle-rgb),.16) 0 1px,transparent 1.4px),radial-gradient(circle at 64% 75%,rgba(255,255,255,.78) 0 1px,transparent 1.4px);background-size:61px 61px,84px 84px,72px 72px;opacity:.48;pointer-events:none}
.split-preview::after{content:"";position:absolute;right:13%;top:14%;width:9px;height:9px;background:linear-gradient(90deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.38) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.38) 47% 53%,transparent 55%);animation:roveiTwinkle 9s ease-in-out infinite;pointer-events:none}
.progress span{background:#E7D7DC;height:5px}.progress span.on{background:linear-gradient(90deg,var(--wine),var(--wine-mid))}

/* Selection cards — tactile packaging, not radio forms */
.choice{background:linear-gradient(180deg,#fff 0%,#fffdfd 100%);border-color:#E4D3D8;border-radius:20px;box-shadow:0 4px 14px rgba(148,22,81,.025);overflow:hidden}
.choice:hover{border-color:#D99EAA;box-shadow:0 14px 32px rgba(148,22,81,.085)}
.choice.selected{border-color:var(--wine);background:linear-gradient(145deg,#fff 0%,#FAECEF 58%,#F5DCE2 100%);box-shadow:0 0 0 1px rgba(148,22,81,.62),0 14px 32px rgba(148,22,81,.09)}
.choice.selected::after{content:"";position:absolute;inset:-80% -45%;background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.48) 50%,transparent 55%);transform:translateX(-45%);pointer-events:none;opacity:.58}
.choice .choice-check{background:#fff7f8;border-color:#D8BCC3;color:transparent}.choice.selected .choice-check{background:var(--wine);color:#fff;box-shadow:0 4px 12px rgba(148,22,81,.17)}
.recommended{background:#F4E6E9;border:1px solid #E6CCD2;padding:5px 8px}

/* Signature live client preview */
.preview-frame{z-index:2}
.preview-label{letter-spacing:.17em;color:#682237}
.phone{background:rgba(255,253,252,.98);border-color:#DCC6CD;border-radius:38px;padding:9px;box-shadow:0 34px 80px rgba(148,22,81,.18),0 3px 10px rgba(148,22,81,.06)}
.phone-inner{border-radius:30px;background:#fffdfd;border-color:rgba(148,22,81,.06)}
.phone-top{height:28px;background:#fffdfd}.notch{background:#3C2B32;opacity:.22}
.client-hero{border-radius:0 0 31px 31px;padding:36px 25px 31px}
.client-hero h3{font-size:2.32rem;line-height:.93;letter-spacing:-.045em;margin-top:24px}
.client-hero h3 .editorial{color:inherit}
.client-hero p{font-family:var(--sans);font-size:.8rem;line-height:1.6}
.phone-body{padding:21px 20px 24px}
.mini-row{padding:13px 13px;border:1px solid #EEE0E4;border-radius:15px;margin-top:9px;background:#fffdfd;align-items:center}
.mini-row:first-child{background:#FBF3F5;border-color:#E8CCD3}.mini-row:last-child{border:1px solid #EEE0E4}
.mini-row strong{font-weight:760}.mini-row span{color:#7B6870}

/* Personal preview payoff */
.preview-page{background:radial-gradient(circle at 78% 12%,var(--preview-tint-b),transparent 27%),radial-gradient(circle at 12% 86%,var(--preview-glow),transparent 30%),linear-gradient(180deg,var(--preview-tint-c) 0%,#FFFDFC 100%);transition:background .28s ease}
.preview-summary{background:linear-gradient(160deg,#FFFDFD 0%,var(--preview-tint-a) 100%);border-color:rgba(var(--preview-sparkle-rgb),.20);box-shadow:0 20px 55px rgba(var(--preview-sparkle-rgb),.10)}
.summary-row{border-color:rgba(var(--preview-sparkle-rgb),.14)}
.preview-page .eyebrow,.preview-page .summary-label{color:var(--theme-accent-ink)}
.preview-page .tag{background:var(--preview-tint-a);color:var(--theme-accent-ink);border-color:rgba(var(--preview-sparkle-rgb),.10)}
.tabs{border-color:rgba(var(--preview-sparkle-rgb),.18);background:rgba(255,255,255,.86)}
.preview-page .tabs button.active{background:linear-gradient(180deg,var(--theme-mid),var(--theme-primary));color:var(--theme-on);box-shadow:0 6px 14px rgba(var(--preview-sparkle-rgb),.16)}
.prof-preview{border-color:rgba(var(--preview-sparkle-rgb),.20);box-shadow:0 28px 65px rgba(var(--preview-sparkle-rgb),.12)}
.prof-head{background:#FFFDFC;border-color:rgba(var(--preview-sparkle-rgb),.14)}
.prof-grid{grid-template-columns:165px 1fr}
.preview-page .prof-side{background:linear-gradient(180deg,var(--theme-sidebar-a) 0%,var(--theme-sidebar-b) 52%,var(--theme-sidebar-c) 100%);border-color:rgba(0,0,0,.12);padding:22px 13px;transition:background .28s ease}
.preview-page .prof-nav-item{color:rgba(255,255,255,.74)}.preview-page .prof-nav-item.on{background:#FFFFFF;color:var(--theme-accent-ink);box-shadow:0 8px 18px rgba(0,0,0,.14)}
.preview-page .prof-main{background:linear-gradient(150deg,#fff 0%,var(--preview-tint-c) 100%)}
.preview-page .skeleton-card{background:#fffdfd;border-color:rgba(var(--preview-sparkle-rgb),.16);box-shadow:0 9px 24px rgba(var(--preview-sparkle-rgb),.05)}
.preview-page .skeleton-card:first-of-type{background:linear-gradient(145deg,var(--preview-tint-a),#FFFDFD)}
.preview-page .empty-line{background:var(--preview-tint-b)}
.preview-page .btn:not(.secondary):not(.ghost){background:linear-gradient(180deg,var(--theme-mid),var(--theme-primary));color:var(--theme-on);box-shadow:0 9px 22px rgba(var(--preview-sparkle-rgb),.16)}
.preview-page .btn:not(.secondary):not(.ghost):hover{background:linear-gradient(180deg,var(--theme-hover),var(--theme-mid));color:var(--theme-on);box-shadow:0 12px 26px rgba(var(--preview-sparkle-rgb),.20)}
.preview-page .btn:not(.secondary):not(.ghost):active{background:linear-gradient(180deg,var(--theme-hover),var(--theme-primary));color:var(--theme-on);box-shadow:0 7px 17px rgba(var(--preview-sparkle-rgb),.16)}
.preview-page .btn.ghost{color:var(--theme-accent-ink)}
.preview-page .btn.ghost:hover{background:var(--preview-tint-a);color:var(--theme-accent-ink)}
.preview-page .btn.ghost:active{background:var(--preview-tint-b);color:var(--theme-accent-ink)}
.preview-page button:focus-visible{outline-color:rgba(var(--preview-sparkle-rgb),.30)}

/* Signup + activation editorial compositions */
.signup-page,.activation-page,.checkout-page{background:radial-gradient(circle at 14% 16%,rgba(238,203,209,.46),transparent 24%),radial-gradient(circle at 88% 80%,rgba(231,189,195,.28),transparent 28%),linear-gradient(145deg,#FFFDFC,#FBF5F6)}
.signup-page,.activation-page,.checkout-page{background:radial-gradient(circle at 14% 16%,var(--preview-glow),transparent 25%),radial-gradient(circle at 88% 80%,var(--preview-tint-b),transparent 30%),linear-gradient(145deg,#FFFDFC,var(--preview-tint-c));transition:background .28s ease}
.signup-page{position:relative;isolation:isolate;overflow-x:hidden}
.signup-page::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 12% 21%,rgba(255,255,255,.82) 0 1px,transparent 1.5px),radial-gradient(circle at 82% 17%,rgba(var(--preview-sparkle-rgb),.12) 0 1px,transparent 1.4px),radial-gradient(circle at 74% 78%,rgba(255,255,255,.74) 0 1px,transparent 1.4px);background-size:67px 67px,91px 91px,76px 76px;opacity:.34}
.signup-page>.narrow-shell{position:relative;z-index:1}
.signup-grid>section:first-child{--preview-tint-a:#F6E2E7;--preview-tint-b:#F0CED6;--preview-tint-c:#F8EDEF;--preview-glow:#F5E2E7;--preview-sparkle-rgb:148,22,81;position:relative;isolation:isolate;overflow:hidden;border-radius:38px;padding:clamp(24px,4vw,45px);background:radial-gradient(circle at 88% 14%,rgba(255,255,255,.78),transparent 25%),radial-gradient(circle at 16% 82%,var(--preview-glow),transparent 32%),linear-gradient(145deg,var(--preview-tint-a) 0%,var(--preview-tint-b) 55%,var(--preview-tint-c) 100%);border:1px solid rgba(var(--preview-sparkle-rgb),.09);box-shadow:0 22px 60px rgba(var(--preview-sparkle-rgb),.10);transition:background .28s ease,border-color .28s ease,box-shadow .28s ease}
.signup-grid>section:first-child::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 18% 18%,rgba(255,255,255,.82) 0 1px,transparent 1.5px),radial-gradient(circle at 79% 30%,rgba(var(--preview-sparkle-rgb),.15) 0 1px,transparent 1.4px),radial-gradient(circle at 58% 76%,rgba(255,255,255,.72) 0 1px,transparent 1.4px);background-size:61px 61px,84px 84px,72px 72px;opacity:.42}
.signup-grid>section:first-child>*{position:relative;z-index:1}
.activation-grid>section:first-child{position:relative;isolation:isolate;overflow:hidden;border-radius:38px;padding:clamp(24px,4vw,45px);background:radial-gradient(circle at 88% 14%,rgba(255,255,255,.78),transparent 25%),radial-gradient(circle at 14% 82%,var(--preview-glow),transparent 34%),linear-gradient(145deg,var(--preview-tint-a) 0%,var(--preview-tint-b) 55%,var(--preview-tint-c) 100%);border:1px solid rgba(var(--preview-sparkle-rgb),.10);box-shadow:0 22px 60px rgba(var(--preview-sparkle-rgb),.10);transition:background .28s ease,border-color .28s ease,box-shadow .28s ease}
.activation-grid>section:first-child::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 18% 18%,rgba(255,255,255,.78) 0 1px,transparent 1.5px),radial-gradient(circle at 80% 29%,rgba(var(--preview-sparkle-rgb),.14) 0 1px,transparent 1.4px),radial-gradient(circle at 58% 78%,rgba(255,255,255,.70) 0 1px,transparent 1.4px);background-size:61px 61px,84px 84px,72px 72px;opacity:.38}
.activation-grid>section:first-child>*{position:relative;z-index:1}
.signup-grid>section:first-child .preview-frame{margin-top:34px}
.form-card{background:rgba(255,253,252,.98);border-color:#DFC7CE;box-shadow:0 28px 70px rgba(148,22,81,.13)}

.activation-page .price-card::before{content:"";position:absolute;right:23px;top:22px;width:9px;height:9px;background:linear-gradient(90deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.42) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.42) 47% 53%,transparent 55%);animation:roveiTwinkle 8s ease-in-out infinite}
.activation-page .price-big,.activation-page .eyebrow,.activation-page .editorial,.checkout-page .eyebrow,.checkout-page .editorial{color:var(--theme-accent-ink)}
.activation-page .billing-toggle{background:rgba(255,255,255,.82);border-color:rgba(var(--preview-sparkle-rgb),.20);box-shadow:0 7px 20px rgba(var(--preview-sparkle-rgb),.07)}

.activation-page .btn:not(.secondary):not(.ghost),.checkout-page .btn:not(.secondary):not(.ghost){background:linear-gradient(180deg,var(--theme-mid),var(--theme-primary));color:var(--theme-on);box-shadow:0 9px 22px rgba(var(--preview-sparkle-rgb),.16)}
.activation-page .btn.ghost,.checkout-page .btn.ghost,.checkout-page .btn.secondary{color:var(--theme-accent-ink)}
.activation-page .btn:not(.secondary):not(.ghost):hover,.checkout-page .btn:not(.secondary):not(.ghost):hover{background:linear-gradient(180deg,var(--theme-hover),var(--theme-mid))}

.boundary{background:linear-gradient(150deg,#fffdfd,#f9edef);border-color:#E0C3CA;box-shadow:0 28px 70px rgba(148,22,81,.11)}

/* Professional application — follows the selected studio theme */
.app-shell{background:radial-gradient(circle at 84% 3%,var(--preview-tint-b),transparent 25%),radial-gradient(circle at 20% 88%,var(--preview-glow),transparent 26%),linear-gradient(180deg,var(--preview-tint-c) 0%,#FFFDFC 100%);transition:background .28s ease}
.sidebar{background:linear-gradient(180deg,var(--theme-sidebar-a) 0%,var(--theme-sidebar-b) 52%,var(--theme-sidebar-c) 100%);border-right-color:rgba(0,0,0,.12);box-shadow:18px 0 46px rgba(var(--preview-sparkle-rgb),.13);transition:background .28s ease}
.sidebar::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 24% 14%,rgba(255,255,255,.14) 0 1px,transparent 1.3px);background-size:31px 31px;opacity:.23}
.sidebar .wordmark{color:#FFFFFF;position:relative;z-index:1}.sidebar .wordmark .dot{color:#FFFFFF}
.nav{position:relative;z-index:1}.nav-btn{color:rgba(255,255,255,.72)}.nav-btn .icon{color:rgba(255,255,255,.78)}.nav-btn:hover{background:rgba(255,255,255,.10);color:#fff}.nav-btn.active{background:#FFFFFF;color:var(--theme-accent-ink);box-shadow:0 11px 25px rgba(0,0,0,.14)}.nav-btn.active .icon{color:var(--theme-accent-ink)}
.owner-card{position:relative;z-index:1;background:#FFFFFF;border-color:rgba(255,255,255,.55);box-shadow:0 10px 28px rgba(0,0,0,.12);color:var(--theme-accent-ink)}.owner-card .avatar{background:var(--theme-primary);color:var(--theme-on);box-shadow:0 8px 18px rgba(0,0,0,.12)}.owner-card strong{color:var(--theme-accent-ink)}.owner-card span{color:#756B6F}
.app-main{background:transparent}.app-content{background:transparent}
.app-shell .btn:not(.secondary):not(.ghost){background:linear-gradient(180deg,var(--theme-mid),var(--theme-primary));color:var(--theme-on);box-shadow:0 9px 22px rgba(var(--preview-sparkle-rgb),.16)}
.app-shell .btn:not(.secondary):not(.ghost):hover{background:linear-gradient(180deg,var(--theme-hover),var(--theme-mid));box-shadow:0 12px 26px rgba(var(--preview-sparkle-rgb),.20)}
.app-shell .btn:not(.secondary):not(.ghost):active{background:linear-gradient(180deg,var(--theme-hover),var(--theme-primary));box-shadow:0 7px 17px rgba(var(--preview-sparkle-rgb),.16)}
.app-shell .btn.secondary,.app-shell .btn.ghost,.app-shell .eyebrow{color:var(--theme-accent-ink)}
.app-shell .btn.secondary:hover,.app-shell .btn.ghost:hover{background:var(--preview-tint-a);border-color:var(--theme-secondary);color:var(--theme-accent-ink)}
.app-shell button:focus-visible,.app-shell input:focus-visible,.app-shell textarea:focus-visible,.app-shell select:focus-visible{outline-color:rgba(var(--preview-sparkle-rgb),.30)}
.app-shell .input:focus,.app-shell .select:focus,.app-shell .textarea:focus{border-color:var(--theme-primary);box-shadow:0 0 0 4px rgba(var(--preview-sparkle-rgb),.18)}
.app-shell .choice:hover{border-color:var(--theme-secondary);box-shadow:0 14px 32px rgba(var(--preview-sparkle-rgb),.09)}
.app-shell .choice.selected{border-color:var(--theme-primary);background:linear-gradient(145deg,#fff 0%,var(--preview-tint-c) 58%,var(--preview-tint-a) 100%);box-shadow:0 0 0 1px rgba(var(--preview-sparkle-rgb),.58),0 14px 32px rgba(var(--preview-sparkle-rgb),.09)}
.app-shell .choice.selected .choice-check{background:var(--theme-primary);border-color:var(--theme-primary);color:var(--theme-on);box-shadow:0 4px 12px rgba(var(--preview-sparkle-rgb),.17)}
.greeting-name{color:var(--theme-accent-ink);white-space:nowrap}

/* Workspace card hierarchy */
.dashboard-primary>.card:first-child{position:relative;overflow:hidden;background:radial-gradient(circle at 92% 10%,rgba(255,255,255,.80),transparent 20%),linear-gradient(135deg,var(--preview-tint-b) 0%,var(--preview-tint-a) 48%,#FFFDFC 100%);border-color:rgba(var(--preview-sparkle-rgb),.22);box-shadow:0 22px 55px rgba(var(--preview-sparkle-rgb),.10)}
.dashboard-primary>.card:first-child::after{content:"";position:absolute;right:24px;top:21px;width:8px;height:8px;background:linear-gradient(90deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.34) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.34) 47% 53%,transparent 55%);animation:roveiTwinkle 9s ease-in-out infinite;pointer-events:none}
.dashboard-primary>.card:nth-child(2){background:#FFFDFC;border-color:rgba(var(--preview-sparkle-rgb),.14)}
.dashboard-side>.card:first-child{background:linear-gradient(145deg,#FFFDFC,var(--preview-tint-a));border-color:rgba(var(--preview-sparkle-rgb),.18)}
.dashboard-side>.card:last-child{background:linear-gradient(145deg,#FFFDFC,var(--preview-tint-c));border-color:rgba(var(--preview-sparkle-rgb),.14)}
.empty-panel{position:relative;overflow:hidden;background:linear-gradient(145deg,#FFFDFC,var(--preview-tint-a));border-color:rgba(var(--preview-sparkle-rgb),.18)}
.empty-panel:nth-child(even){background:linear-gradient(145deg,#fff,var(--preview-tint-c))}
.empty-icon{background:linear-gradient(145deg,var(--theme-mid),var(--theme-primary));color:var(--theme-on);box-shadow:0 9px 21px rgba(var(--preview-sparkle-rgb),.16)}
.list-card{border-color:rgba(var(--preview-sparkle-rgb),.16)}.list-row{border-color:rgba(var(--preview-sparkle-rgb),.13)}.list-row:hover{background:var(--preview-tint-c)}.client-avatar{background:linear-gradient(145deg,var(--preview-tint-b),var(--theme-secondary));color:var(--theme-accent-ink);box-shadow:inset 0 0 0 1px rgba(var(--preview-sparkle-rgb),.06)}

/* Client directory / profile: premium client memory, not clinical */
.detail-hero{position:relative;overflow:hidden;padding:70px 28px 28px;border-radius:180px 180px 29px 29px;background:radial-gradient(circle at 76% 18%,rgba(255,255,255,.88),transparent 22%),linear-gradient(180deg,#F1CDD5 0%,#F8E7EA 48%,#FFFDFC 100%);border-color:#D7A4B0;box-shadow:0 26px 62px rgba(148,22,81,.13)}
.detail-hero::before{content:"";position:absolute;left:20%;top:19%;width:7px;height:7px;background:linear-gradient(90deg,transparent 45%,rgba(148,22,81,.34) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(148,22,81,.34) 47% 53%,transparent 55%);animation:roveiTwinkle 9s ease-in-out infinite;pointer-events:none}
.detail-name{font-size:2.25rem;color:var(--wine)}
.data-block{background:linear-gradient(150deg,#FFFDFC,#FFF9FA);border-color:#E6D1D7}
.data-row{border-color:#E9D9DE}.data-row .k{color:#846C75}.data-row .v{color:#35262C}
.detail-side>.card{background:linear-gradient(160deg,#fff,#F8ECEF);border-color:#E2C9D0}
.file-box{background:linear-gradient(145deg,#FFFDFC,#FAF0F2);border-color:#D8B6BF}.thumb,.photo-chip img{border-radius:18px;border:6px solid #FFFDFC;outline:1px solid #E0CAD0;box-shadow:0 9px 22px rgba(148,22,81,.08)}

/* Beauty Packs — luxe recipe cards */
.app-shell .content-stack>.choice-grid>article.card{position:relative;overflow:hidden;background:linear-gradient(140deg,#FFFDFC 0%,#F9EAED 100%);border-color:#E0C0C8;border-left:4px solid var(--wine);box-shadow:0 18px 42px rgba(148,22,81,.08)}
.app-shell .content-stack>.choice-grid>article.card::after{content:"";position:absolute;right:18px;top:18px;width:6px;height:6px;background:linear-gradient(90deg,transparent 45%,rgba(148,22,81,.32) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(148,22,81,.32) 47% 53%,transparent 55%);opacity:.65}

/* Studio + settings: light controls, expressive preview */
.studio-sections>.card:nth-child(odd),.settings-grid>.card:nth-child(odd){background:linear-gradient(145deg,#FFFDFC,#FBF2F4)}
.studio-sections>.card:nth-child(even),.settings-grid>.card:nth-child(even){background:#fff}
.studio-preview{padding:18px;border-radius:32px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.8),transparent 24%),radial-gradient(circle at 14% 12%,var(--preview-glow),transparent 21%),linear-gradient(145deg,var(--preview-tint-a) 0%,var(--preview-tint-b) 52%,var(--preview-tint-c) 100%);border:1px solid rgba(var(--preview-sparkle-rgb),.16);transition:background .28s ease,border-color .28s ease}
.studio-preview::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 18% 21%,rgba(255,255,255,.8) 0 1px,transparent 1.4px),radial-gradient(circle at 82% 27%,rgba(var(--preview-sparkle-rgb),.14) 0 1px,transparent 1.35px),radial-gradient(circle at 70% 78%,rgba(255,255,255,.72) 0 1px,transparent 1.4px);background-size:58px 58px,79px 79px,68px 68px;opacity:.42}
.studio-preview::after{content:"";position:absolute;right:11%;top:10%;z-index:1;width:8px;height:8px;pointer-events:none;background:linear-gradient(90deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.32) 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(var(--preview-sparkle-rgb),.32) 47% 53%,transparent 55%);animation:roveiTwinkle 9s ease-in-out infinite}

/* Schedule stays operational, but uses Rovei material cues */
.schedule-controls{padding:12px 14px;border:1px solid #E4CED4;border-radius:18px;background:#FFF9FA}
.segmented{background:#F9ECEF;border-color:#E1C7CE}
.day-col{background:#FFFDFC;border-color:#E6D3D8;box-shadow:0 8px 24px rgba(148,22,81,.045)}
.day-head{color:var(--wine)}
.appt{background:#fffdfd!important;border-color:#E3CDD3;border-left-color:var(--wine);box-shadow:0 4px 14px rgba(148,22,81,.04)}
.today-appt{border-color:#E4CED4;box-shadow:0 9px 24px rgba(148,22,81,.055)}

/* Statuses retain semantic colour families */
.status.waiting{background:#F7EBDD;color:#815D36}.status.ready{background:#EAF2EC;color:#4D6A57}.status.complete{background:#F1D9DE;color:var(--wine)}

/* Client portal — studio theme remains primary; Rovei stays quiet */
.client-page{background-image:radial-gradient(circle at 83% 10%,rgba(255,255,255,.72),transparent 23%),radial-gradient(circle at 8% 88%,rgba(255,255,255,.5),transparent 27%)!important;overflow-x:hidden}
.client-shell{position:relative}
.client-shell::before,.client-shell::after{content:"";position:absolute;pointer-events:none;width:7px;height:7px;background:linear-gradient(90deg,transparent 45%,currentColor 47% 53%,transparent 55%),linear-gradient(0deg,transparent 45%,currentColor 47% 53%,transparent 55%);opacity:.18;animation:roveiTwinkle 9s ease-in-out infinite}
.client-shell::before{right:-16px;top:90px}.client-shell::after{left:-18px;bottom:25%;animation-delay:3s}
.client-card{position:relative;overflow:hidden;background:rgba(255,255,255,.95);border-radius:36px;box-shadow:0 26px 70px rgba(58,33,42,.13)}
.client-card::after{content:"";position:absolute;inset:-45% -65%;background:linear-gradient(108deg,transparent 44%,rgba(255,255,255,.23) 50%,transparent 56%);transform:translateX(-35%);animation:roveiSheen 11s ease-in-out infinite;pointer-events:none}
.client-card>*{position:relative;z-index:1}
.client-heading{font-weight:600;letter-spacing:-.045em}
.portal-progress span{height:5px;background:rgba(0,0,0,.1)}
.portal-option{border-radius:18px;transition:.2s ease;box-shadow:0 4px 14px rgba(0,0,0,.025)}
.portal-option:has(input:checked){box-shadow:0 9px 22px rgba(0,0,0,.055)}
.big-check{box-shadow:0 12px 28px rgba(0,0,0,.13)}

.client-page .tag{background:var(--preview-tint-a);color:var(--theme-accent-ink);border-color:rgba(var(--preview-sparkle-rgb),.12)}
.client-page input[type="checkbox"],.client-page input[type="radio"]{accent-color:var(--theme-primary)}
.client-page .input:focus,.client-page .select:focus,.client-page .textarea:focus{border-color:var(--theme-primary);box-shadow:0 0 0 4px rgba(var(--preview-sparkle-rgb),.16)}
.client-page .inline-disclosure{color:var(--theme-accent-ink)}
.app-shell .client-detail-page .tag{background:var(--preview-tint-a);color:var(--theme-accent-ink);border-color:rgba(var(--preview-sparkle-rgb),.12)}
.app-shell .client-detail-page .body,.app-shell .client-detail-page .caption{color:var(--theme-accent-ink)}
.app-shell .client-detail-page .caption{opacity:.70}

/* Mobile navigation: warm floating beauty dock */
.mobile-nav{background:rgba(255,250,250,.96);border-color:#DFC4CB;box-shadow:0 18px 50px rgba(148,22,81,.16)}
.mobile-nav button.active{background:var(--preview-tint-a);color:var(--theme-accent-ink)}

/* Responsive refinement */
@media(max-width:980px){
  .signup-grid>section:first-child,.activation-grid>section:first-child{padding:28px}

  .detail-hero{border-radius:150px 150px 28px 28px}
}

  .welcome::before{opacity:.2}
  .split-preview{min-height:560px}
  .sidebar{display:none}

  .app-content{padding-top:30px}

}

}

  .cosmetic-sheen::after,.arch-top::before,.welcome-art::before,.welcome-art::after,.split-preview::after,.studio-preview::after,.price-card::before,.dashboard-primary>.card:first-child::after,.detail-hero::before,.client-shell::before,.client-shell::after,.client-card::after{animation:none!important}

}

/* Reusable client-link flow + tidy themed client record */
.inline-disclosure{appearance:none;border:0;background:transparent;padding:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}.inline-disclosure:hover{opacity:.72}.inline-disclosure:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}

.app-shell .client-detail-grid .detail-name{color:var(--theme-accent-ink);font-size:2.2rem;margin-top:13px}
.app-shell .client-detail-grid .client-avatar{background:linear-gradient(145deg,var(--theme-secondary),var(--preview-tint-a));color:var(--theme-accent-ink);border:1px solid rgba(var(--preview-sparkle-rgb),.12)}
.app-shell .client-detail-grid .data-block,.app-shell .client-detail-grid .detail-side>.card{background:linear-gradient(150deg,#FFFDFC 0%,var(--preview-tint-c) 100%);border-color:rgba(var(--preview-sparkle-rgb),.18);box-shadow:0 16px 42px rgba(var(--preview-sparkle-rgb),.07)}
.app-shell .client-detail-grid .data-row{border-color:rgba(var(--preview-sparkle-rgb),.14)}.app-shell .client-detail-grid .data-row .k{color:var(--theme-accent-ink)}.app-shell .client-detail-grid .data-row .v{color:var(--text)}

@media(max-width:980px){.app-shell .client-detail-grid{grid-template-columns:1fr}.app-shell .client-detail-grid .detail-side{position:static}}



/* =========================================================
   CHERRY REFINEMENT PATCH — requested visual + UX updates
   ========================================================= */
:root{
  --wine:#941651;
  --wine-deep:#6F103D;
  --wine-mid:#AA1C5F;
  --wine-hover:#7E1447;

@keyframes roveiGrainShift{0%{background-position:0 0,0 0,0 0,0 0}25%{background-position:0 0,0 0,0 0,14px -9px}50%{background-position:0 0,0 0,0 0,-11px 13px}75%{background-position:0 0,0 0,0 0,9px 7px}100%{background-position:0 0,0 0,0 0,0 0}}
@keyframes roveiCloudFloat{0%,100%{transform:scale(1) translate3d(0,0,0)}50%{transform:scale(1.03) translate3d(0,-6px,0)}}
@keyframes roveiBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Replace sparkle-dot texture with true grain + clouding */
.welcome::before,
.split-preview::before,
.signup-page::before,
.signup-grid>section:first-child::before,
.activation-grid>section:first-child::before,
.studio-preview::before,
.preview-summary::before,
.dashboard-primary>.card:first-child::before,
.dashboard-side>.card:first-child::before,
.dashboard-side>.card:last-child::before,
.empty-panel::before,
.detail-hero::after,
.client-card::before,
.app-shell .client-detail-grid .detail-hero::after,
.app-shell .client-detail-grid .data-block::before,
.app-shell .client-detail-grid .detail-side>.card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle at 18% 20%, rgba(255,255,255,.46), transparent 20%),
    radial-gradient(circle at 82% 24%, rgba(var(--preview-sparkle-rgb),.13), transparent 28%),
    radial-gradient(circle at 52% 82%, rgba(255,255,255,.16), transparent 22%),
    var(--grain-map);
  background-size:auto,auto,auto,180px 180px;
  mix-blend-mode:soft-light;
  opacity:.85;
  animation:roveiGrainShift 16s steps(8) infinite, roveiCloudFloat 18s ease-in-out infinite;
  z-index:0;
}
.welcome-art::before,
.welcome-art::after,
.split-preview::after,
.studio-preview::after,
.price-card::before,
.dashboard-primary>.card:first-child::after,
.detail-hero::before,
.client-shell::before,
.client-shell::after,
.app-shell .content-stack>.choice-grid>article.card::after,
.app-shell .client-detail-grid .detail-hero::before,
.app-shell .client-detail-grid .detail-side>.card::after,
.client-card::after{
  content:none!important;
  display:none!important;
}
.preview-summary,
.dashboard-primary>.card:first-child,
.dashboard-side>.card:first-child,
.dashboard-side>.card:last-child,
.empty-panel,
.signup-grid>section:first-child,
.activation-grid>section:first-child,
.studio-preview,
.detail-hero,
.client-card,
.app-shell .client-detail-grid .data-block,
.app-shell .client-detail-grid .detail-side>.card{
  position:relative;
  overflow:hidden;
}
.preview-summary>*,
.dashboard-primary>.card:first-child>*,
.dashboard-side>.card:first-child>*,
.dashboard-side>.card:last-child>*,
.empty-panel>*,
.signup-grid>section:first-child>*,
.activation-grid>section:first-child>*,
.studio-preview>*,
.detail-hero>*,
.client-card>*,
.app-shell .client-detail-grid .data-block>*,
.app-shell .client-detail-grid .detail-side>.card>*{position:relative;z-index:1}

/* Solid client detail hero card with atmosphere retained */
.app-shell .client-detail-grid .detail-hero{
  background:linear-gradient(180deg,var(--preview-tint-a) 0%,var(--preview-tint-a) 100%)!important;
  border:1px solid rgba(var(--preview-sparkle-rgb),.22)!important;
  box-shadow:0 24px 56px rgba(var(--preview-sparkle-rgb),.10)!important;
}
.app-shell .client-detail-grid .detail-name,
.app-shell .client-detail-page .body,
.app-shell .client-detail-page .caption{color:var(--theme-accent-ink)}

/* Curvier app shell like reference */
.sidebar{
  left:8px;
  top:8px;
  bottom:8px;
  width:220px;
  border-radius:0 34px 34px 0;
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.app-main{padding-left:246px}

/* More lively interactions */
.interactive-surface{
  transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(0);
  transform-style:preserve-3d;
  transition:transform .22s ease,box-shadow .24s ease,border-color .24s ease,background .26s ease;
  will-change:transform;
}
.interactive-surface:hover{
  transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);
}
.interactive-float:hover{animation:roveiBob 1.8s ease-in-out infinite}
.card:hover,.phone:hover,.arch-card:hover,.client-card:hover,.detail-hero:hover,.price-card:hover{box-shadow:0 22px 54px rgba(var(--preview-sparkle-rgb,148,22,81),.12)}
.btn{transition:transform .16s ease,box-shadow .22s ease,filter .22s ease}
.btn:hover{filter:saturate(1.03)}
.btn-ripple{position:absolute;border-radius:999px;transform:translate(-50%,-50%);pointer-events:none;background:rgba(255,255,255,.34);width:14px;height:14px;animation:roveiRipple .7s ease-out forwards}
@keyframes roveiRipple{from{opacity:.7;transform:translate(-50%,-50%) scale(0)}to{opacity:0;transform:translate(-50%,-50%) scale(12)}}

/* Password field + readable legal docs */
.signup-page .signup-grid{align-items:center;gap:clamp(36px,6vw,78px)}
.signup-page .form-card{width:100%;max-width:640px;margin-inline:auto}
.signup-page .form-stack{gap:18px}
.google-signup{width:100%;min-height:48px;border:1px solid #D8D4D6;border-radius:999px;background:#FFFFFF;color:#292326;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.86rem;font-weight:760;box-shadow:0 5px 16px rgba(36,25,29,.05);transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease;cursor:pointer}
.google-signup:hover{transform:translateY(-1px);border-color:#C7C1C4;box-shadow:0 8px 20px rgba(36,25,29,.08)}
.google-signup:active{transform:scale(.992)}
.google-g{font-family:Arial,Helvetica,sans-serif;font-size:1.18rem;font-weight:800;line-height:1;background:conic-gradient(from -35deg,#4285F4 0 25%,#34A853 25% 43%,#FBBC05 43% 62%,#EA4335 62% 78%,#4285F4 78% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.signup-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.7rem;font-weight:750;text-transform:uppercase;letter-spacing:.1em}
.signup-divider::before,.signup-divider::after{content:"";height:1px;background:var(--border);flex:1}
.password-field{display:grid;gap:8px}
.password-input-wrap{position:relative}
.password-input-wrap .input{padding-right:86px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--theme-accent-ink,var(--wine));font-size:.78rem;font-weight:800;padding:8px 10px;border-radius:999px;cursor:pointer}
.password-toggle:hover{background:rgba(var(--preview-sparkle-rgb,148,22,81),.08)}
.text-link-btn{appearance:none;border:0;background:none;padding:0;color:var(--theme-primary,var(--wine));font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.text-link-btn:hover{opacity:.82}
.consent-box{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);border-radius:16px;padding:14px 15px;background:rgba(255,255,255,.46);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.consent-box input{accent-color:var(--theme-primary,var(--wine));width:17px;height:17px;margin:2px 0 0;flex:0 0 auto}
.consent-copy{font-size:.82rem;line-height:1.55;color:var(--text)}
.consent-box.invalid{border-color:#B4233D;background:#FFF7F8;box-shadow:0 0 0 3px rgba(180,35,61,.08)}
.signup-validation{display:none;color:#B4233D;background:#FFF4F6;border:1px solid #E9A8B5;border-radius:14px;padding:11px 13px;font-size:.77rem;font-weight:760;line-height:1.45}
.signup-validation.show{display:block;animation:enter .18s ease both}
.input.invalid{border-color:#B4233D!important;box-shadow:0 0 0 3px rgba(180,35,61,.08)!important}
.legal-sheet{width:min(100%,780px);max-height:min(86vh,940px);padding:30px 28px 22px}
.legal-scroll{max-height:calc(86vh - 180px);overflow:auto;padding-right:6px}
.legal-intro{font-size:.88rem;line-height:1.65;color:var(--muted);margin:14px 0 0}
.doc-section{padding:16px 0;border-top:1px solid var(--border)}
.doc-section:first-child{border-top:0;padding-top:0}
.doc-section h4{margin:0 0 8px;font-size:.95rem;letter-spacing:-.02em}

/* =========================================================
   STABILITY PASS — lightweight interaction, no JS tilt/ripple
   ========================================================= */

.interactive-surface:hover,
.interactive-float:hover{
  transform:none!important;
  animation:none!important;
}

  transition:transform .18s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease;

hero-pop{\n  position:absolute;z-index:3;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:999px;\n  border:1px solid rgba(148,22,81,.16);background:rgba(255,255,255,.75);backdrop-filter:blur(14px);\n  box-shadow:0 14px 35px rgba(86,15,31,.08);color:#725A64;font-size:10px;letter-spacing:.14em;font-weight:900;\n  opacity:0;animation:heroPopIn .7s cubic-bezier(.2,.8,.2,1) forwards, heroFloat 5s ease-in-out 1s infinite\n}\n.hero-pop i{width:7px;height:7px;border-radius:50%;background:var(--burgundy);box-shadow:0 0 0 5px rgba(148,22,81,.09)}\n.hero-pop.one{left:7%;top:36%;animation-delay:.55s,1.3s}\n.hero-pop.two{right:7%;top:31%;animation-delay:.78s,1.6s}\n.hero-pop.three{right:12%;top:57%;animation-delay:1.02s,1.9s}\n@keyframes heroPopIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}\n@keyframes heroFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}\n\n/* Hero pointer parallax variables */\n.hero .orbit.one{transform:translateX(calc(-50% + var(--hx1,0px))) translateY(var(--hy1,0px))}\n.hero .orbit.two{transform:translateX(calc(-50% + var(--hx2,0px))) translateY(var(--hy2,0px))}\n.hero .orbit.three{transform:translateX(calc(-50% + var(--hx3,0px))) translateY(var(--hy3,0px))}\n.hero .halo.left{translate:var(--hlx,0px) var(--hly,0px)}\n.hero .halo.right{translate:var(--hrx,0px) var(--hry,0px)}\n\n/* Scroll reveals */\n.motion-ready .reveal{\n  opacity:0;transform:translateY(26px) scale(.986);filter:blur(5px);\n  transition:opacity .72s cubic-bezier(.2,.7,.2,1),transform .72s cubic-bezier(.2,.7,.2,1),filter .72s ease;\n  transition-delay:var(--reveal-delay,0ms)\n}\n.motion-ready .reveal.is-visible{opacity:1;transform:none;filter:blur(0)}\n\n/* Cards feel alive without wobbling */\n.lift-card{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}\n.lift-card:hover{transform:translateY(-6px);box-shadow:0 28px 70px rgba(64,23,44,.14)}\n.legal-card:hover{border-color:#CBA8B5}\n.visit-card:hover{border-color:rgba(255,255,255,.28)}\n\n/* Product / theme feedback */\n.screen-tab.active{animation:tabPop .32s cubic-bezier(.2,.8,.2,1)}\n@keyframes tabPop{0%{transform:scale(.94)}65%{transform:scale(1.045)}100%{transform:scale(1)}}\n.screen-bump{animation:screenBump .38s cubic-bezier(.2,.8,.2,1)}\n@keyframes screenBump{0%{transform:scale(.992)}60%{transform:scale(1.006)}100%{transform:scale(1)}}\n\n.theme-btn:active{transform:scale(.95)}\n.theme-pop{animation:themePop .46s cubic-bezier(.2,.9,.2,1)}\n@keyframes themePop{0%{transform:scale(.985)}45%{transform:scale(1.012)}100%{transform:scale(1)}}\n.play-stage.theme-flash::before{\n  content:\"\";position:absolute;inset:18%;z-index:3;border-radius:50%;pointer-events:none;\n  background:radial-gradient(circle,rgba(var(--studio-rgb),.22),transparent 68%);animation:themeFlash .55s ease-out\n}\n@keyframes themeFlash{from{opacity:1;transform:scale(.55)}to{opacity:0;transform:scale(1.45)}}\n\n.motion-toast{\n  position:fixed;right:24px;bottom:24px;z-index:80;display:flex;align-items:center;gap:9px;\n  background:#FFF9FB;color:#4D3440;border:1px solid #DCC8D0;border-radius:999px;padding:11px 15px;\n  box-shadow:0 18px 50px rgba(36,25,29,.16);font-size:11px;font-weight:800;letter-spacing:.04em;\n  opacity:0;transform:translateY(12px) scale(.97);pointer-events:none;transition:.25s ease\n}\n.motion-toast.show{opacity:1;transform:none}\n.motion-toast i{width:8px;height:8px;border-radius:50%;background:var(--studio)}\n\n/* Pricing and FAQ micro animation */\n.price.price-pop{animation:pricePop .36s cubic-bezier(.2,.8,.2,1)}\n@keyframes pricePop{0%{opacity:.35;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:none}}\n.faq details[open] p{animation:faqAnswer .28s ease both}\n@keyframes faqAnswer{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}\n\n/* Moving banner sparkle */\n.marquee-track i{display:inline-block;animation:sparkPulse 2.8s ease-in-out infinite}\n@keyframes sparkPulse h3><p>Use the same carefully designed client experience for the appointments you offer most.</p><div class=\"sage-pills\"><span>Consultation</span><span>Preferences</span><span>Inspiration</span><span>Consent</span><span>Prep</span><span>Current photos</span></div></div>\n  </div>\n</section>\n\n<section class=\"section memory\" id=\"memory\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">AFTER THE APPOINTMENT</div><h2 class=\"section-title\">Six weeks later,<br><em>you still remember.</em></h2><p class=\"copy\">Client memory should feel like a signature Rovei moment, not another generic dashboard card.</p>\n    <div class=\"memory-grid\">\n      <article class=\"signature-card\">\n        <div class=\"signature-identity\"><div><small>LASHES · CLIENT MEMORY</small><h3>Emily<br>Carter</h3><p>Soft finish · Quiet & relaxed</p></div><span class=\"signature-status\">VISIT COMPLETE</span></div>\n        <div class=\"signature-info\"><div class=\"signature-line\"><span>Preferred finish</span><b>Soft</b></div><div class=\"signature-line\"><span>Appointment feel</span><b>Quiet & relaxed</b></div><div class=\"signature-line\"><span>Last visit</span><b>Natural wispy set · soft outer lift</b></div><div class=\"signature-line\"><span>Client goal</span><b>“Soft but still put together.”</b></div></div>\n      </article>\n      <div><div class=\"visit-card\"><small>LAST VISIT</small><h3>Natural wispy set</h3><p>Soft outer lift, lighter inner corners. Emily preferred something polished without looking too dramatic.</p></div><div class=\"visit-card\"><small>WHY IT MATTERS</small><h3>Walk in already remembering.</h3><p>The context from the last appointment is ready before the next one starts.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"section pricing\" id=\"pricing\">\n  <div class=\"wrap\"><div class=\"pricing-head\"><div class=\"eyebrow\">ROVEI STUDIO</div><h2 class=\"section-title\">One plan.<br><em>Your whole client experience.</em></h2><p class=\"copy\">No pricing maze. Monthly or annual, same Rovei.</p></div>\n    <div class=\"price-card\"><div class=\"price-top\"><div><div class=\"eyebrow\">ROVEI STUDIO</div><strong style=\"font:400 30px/1 var(--serif)\">Studio plan</strong></div><div class=\"billing\"><button class=\"active\" data-billing=\"monthly\">Monthly</button><button data-billing=\"annual\">Annual</button></div></div><div class=\"price\" data-price>$129</div><div class=\"copy\" data-price-sub>/ month · billed monthly</div><div class=\"included\"><div><b>CLIENT READINESS</b><span>Know who is ready before they arrive.</span></div><div><b>CLIENT MEMORY</b><span>Preferences, visits and context together.</span></div><div><b>BEAUTY PACKS</b><span>Reusable client-experience templates.</span></div><div><b>CUSTOM STUDIO</b><span>Your colour, your client experience.</span></div></div><button class=\"btn\" type=\"button\" data-enter-product style=\"width:100%;margin-top:20px\">Start your studio ↗</button></div>\n  </div>\n</section>\n\n<div class=\"marquee burgundy\"><div class=\"marquee-track\"><span>PREPARED <i>✦</i> PERSONAL <i>✦</i> REMEMBERED <i>✦</i> YOUR STUDIO <i>✦</i> YOUR CLIENT EXPERIENCE <i>✦</i></span><span>PREPARED <i>✦</i> PERSONAL <i>✦</i> REMEMBERED <i>✦</i> YOUR STUDIO <i>✦</i> YOUR CLIENT EXPERIENCE <i>✦</i></span></div></div>\n\n<section class=\"section faq\" id=\"faq\">\n  <div class=\"wrap faq-grid\"><div><div class=\"eyebrow\">FAQ</div><h2 class=\"section-title\">Good questions.<br><em>Clear answers.</em></h2></div><div class=\"faq-list\"><details><summary>Is Rovei booking software? <span>+</span></summary><p>No. Rovei focuses on client readiness and client memory. Your booking workflow can stay where it already lives.</p></details><details><summary>Does my client need an account? <span>+</span></summary><p>No. The client experience is designed to open from a simple link without requiring an account or app download.</p></details><details><summary>Can I customise what clients see? <span>   <a class=\"legal-link\" href=\"#\" data-login>Log in to Rovei ↗</a>\n    </article>\n  </div>\n</section>\n\n<footer class=\"footer\"><div class=\"wrap footer-inner\"><a class=\"logo\" href=\"#top\">Rovei.</a><p>Client readiness + client memory for beauty professionals.<br><small>Client readiness + client memory for beauty professionals.</small></p><a href=\"#privacy\">Privacy</a><a href=\"#terms\">Terms</a><a href=\"#\" data-login>Log in</a></div></footer>\n\n<dialog class=\"dialog\" data-dialog><div class=\"dialog-inner\"><button class=\"dialog-close\" data-close aria-label=\"Close\">×</button><div class=\"eyebrow\">LANDING PAGE ONLY</div><h2>Landing + product preview are now connected.</h2><p>This merged founder preview connects the public landing experience to the existing Rovei product flow. Backend authentication and real payments are still intentionally not connected.</p><button class=\"btn\" data-close>Back to the concept</button></div></dialog>\n<div class=\"motion-toast\" data-motion-toast role=\"status\" aria-live=\"polite\"><i></i><span>Studio preview updated</span></div>\n\n<script>\n(()=>{\n  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n  document.documentElement.classList.add('motion-ready');\n\n  // Scroll progress\n  const scrollBar=document.querySelector('[data-scroll-progress]');\n  const updateScroll=()=>{\n    const max=document.documentElement.scrollHeight-innerHeight;\n    const pct=max>0?(scrollY/max)*100:0;\n    if(scrollBar)scrollBar.style.width=Math.min(100,Math.max(0,pct))+'%';\n  };\n  addEventListener('scroll',updateScroll,{passive:true});\n  addEventListener('resize',updateScroll);\n  updateScroll();\n\n  // Scroll reveals with small editorial stagger\n  const revealTargets=[\n    ...document.querySelectorAll('.questions-grid > *, .custom-grid > *, .ink-grid > *, .client-grid > *, .sage-grid > *, .memory-grid > *, .pricing-head, .price-card, .faq-grid > *, .legal-card, .final .wrap > *')\n  ];\n  revealTargets.forEach((el,i)=>{\n    el.classList.add('reveal');\n    el.style.setProperty('--reveal-delay',`${(i%3)*85}ms`);\n  });\n  if(!reduced && 'IntersectionObserver' in window){\n    const io=new IntersectionObserver(entries=>{\n      entries.forEach(entry=>{\n        if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target)}\n      });\n    },{threshold:.13,rootMargin:'0px 0px -6% 0px'});\n    revealTargets.forEach(el=>io.observe(el));\n  }else revealTargets.forEach(el=>el.classList.add('is-visible'));\n\n  // Subtle hero pointer parallax\n  const hero=document.querySelector('.hero');\n  if(hero && !reduced){\n    hero.addEventListener('pointermove',e=>{\n      const r=hero.getBoundingClientRect();\n      const nx=(e.clientX-r.left)/r.width-.5, ny=(e.clientY-r.top)/r.height-.5;\n      hero.style.setProperty('--hx1',`${nx*18}px`);hero.style.setProperty('--hy1',`${ny*10}px`);\n      hero.style.setProperty('--hx2',`${nx*-12}px`);hero.style.setProperty('--hy2',`${ny*-7}px`);\n      hero.style.setProperty('--hx3',`${nx*7}px`);hero.style.setProperty('--hy3',`${ny*5}px`);\n      hero.style.setProperty('--hlx',`${nx*16}px`);hero.style.setProperty('--hly',`${ny*10}px`);\n      hero.style.setProperty('--hrx',`${nx*-18}px`);hero.style.setProperty('--hry',`${ny*-10}px`);\n    });\n    hero.addEventListener('pointerleave',()=>{\n      ['--hx1','--hy1','--hx2','--hy2','--hx3','--hy3','--hlx','--hly','--hrx','--hry'].forEach(v=>hero.style.removeProperty(v));\n    });\n  }\n\n  // Premium hover lift on selected cards\n  document.querySelectorAll('.signature-card,.price-card,.sage-card,.visit-card,.legal-card').forEach(el=>el.classList.add('lift-card'));\n\n  const screens=['home','schedule','clients','experience','packs','studio'];\n  const labels=['Home','Schedule','Clients','Client experience','Beauty Packs','Studio'];\n  const panels=[...document.querySelectorAll('[data-panel]')];\n  const tabs=[...document.querySelectorAll('[data-screen]')];\n  const menus=[...document.querySelectorAll('[data-menu]')];\n  const caption=document.querySelector('[data-film-caption]');\n  const progress=document.querySelector('[data-film-progress]');\n  const toggle=document.querySelector('[data-film-toggle]');\n  const replay=document.querySelector('[data-film-replay]');\n  let elapsed=0,playing=!reduced,timer;\n  const duration=24000,slot=duration/screens.length;\n\n  function show(name,manual=false){\n    const i=Math.max(0,screens.indexOf(name));\n    panels.forEach(p=>p.hidden=p.dataset.panel!==name);\n    tabs.forEach(t=>t.classList.toggle('active',t.dataset.screen===name));\n    menus.forEach(m=>m.classList.toggle('active',m.dataset.menu===name || (name==='experience'&&m.dataset.menu==='clients')));\n    caption.textContent=String(i+1).padStart(2,'0')+' / '+labels[i];\n    if(manual){elapsed=i*slot;progress.style.width=(elapsed/duration*100)+'%'}\n  }\n  function render(){\n    const i=Math.min(screens.length-1,Math.floor(elapsed/slot));\n    show(screens[i]);\n    progress.style.width=Math.min(100,elapsed/duration*100)+'%';\n    toggle.textContent=playing?'Pause Ⅱ':'Play ▶';\n  }\n  function stop(){if(timer){clearInterval(timer);timer=null}}\n  function start(){stop();if(!playing||reduced||document.hidden)return;timer=setInterval(()=>{elapsed+=100;if(elapsed>=duration)elapsed=0;render()},100)}\n  tabs.forEach(t=>t.addEventListener('click',()=>{playing=false;stop();show(t.dataset.screen,true);render();const w=document.querySelector('.white-wrapper');if(w){w.classList.remove('screen-bump');void w.offsetWidth;w.classList.add('screen-bump')}}));\n  toggle.addEventListener('click',()=>{playing=!playing;render();playing?start():stop()});\n  replay.addEventListener('click',()=>{elapsed=0;playing=!reduced;render();start()});\n  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());\n  elapsed=0;show('home');render();start();\n\n  const acc=[...document.querySelectorAll('.acc-item')];\n  acc.forEach(item=>{\n    const btn=item.querySelector('.acc-btn');\n    btn.addEventListener('click',()=>{\n      const open=!item.classList.contains('open');\n      acc.forEach(x=>{x.classList.remove('open');x.querySelector('.acc-btn').setAttribute('aria-expanded','false')});\n      if(open){item.classList.add('open');btn.setAttribute('aria-expanded','true')}\n    })\n  });\n\n  const root=document.documentElement;\n  const themes={\n    wine:{p:'#941651',on:'#FFFFFF',soft:'#F5E7EC'},\n    blush:{p:'#C98591',on:'#24191D',soft:'#F8E9EC'},\n    mauve:{p:'#8B7081',on:'#FFFFFF',soft:'#F0E8EE'},\n    sage:{p:'#697667',on:'#FFFFFF',soft:'#EDF2EA'},\n    pearl:{p:'#E5DDDA',on:'#24191D',soft:'#FAF7F5'},\n    lilac:{p:'#786579',on:'#FFFFFF',soft:'#F2ECF4'},\n    ink:{p:'#171416',on:'#FFFFFF',soft:'#EEECEC'}\n  };\n  function rgb(hex){hex=hex.replace('#','');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}\n  function foreground(hex){\n    const vals=rgb(hex).map(v=>v/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));\n    const L=.2126*vals[0]+.7152*vals[1]+.0722*vals[2];\n    return L>.46?'#24191D':'#FFFFFF'\n  }\n  function tint(hex){const [r,g,b]=rgb(hex);return`rgb(${Math.round(r*.12+255*.88)},${Math.round(g*.12+255*.88)},${Math.round(b*.12+255*.88)})`}\n  function apply(name,hex){\n    const t=name==='custom'?{p:hex,on:foreground(hex),soft:tint(hex)}:themes[name];\n    const [r,g,b]=rgb(t.p);\n    root.style.setProperty('--studio',t.p);\n    root.style.setProperty('--studio-on',t.on);\n    root.style.setProperty('--studio-soft',t.soft);\n    root.style.setProperty('--studio-rgb',`${r},${g},${b}`);\n    document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x.dataset.theme===name));\n    document.querySelector('[data-custom]').hidden=name!=='custom';\n    document.querySelectorAll('[data-studio-hex]').forEach(x=>x.textContent=t.p.toUpperCase());\n    if(name==='custom')document.querySelector('[data-custom-dot]').style.background=t.p;\n    const stage=document.querySelector('.play-stage');\n    if(stage){stage.classList.remove('theme-pop','theme-flash');void stage.offsetWidth;stage.classList.add('theme-pop','theme-flash')}\n    const toast=document.querySelector('[data-motion-toast]');\n    if(toast){toast.classList.add('show');clearTimeout(window.__roveiToast);window.__roveiToast=setTimeout(()=>toast.classList.remove('show'),1500)}\n  }\n  document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{\n    if(b.dataset.theme==='custom'){\n      let h=document.querySelector('[data-hex]').value.trim();\n      if(!/^#[0-9a-f]{6}$/i.test(h))h='#8A4053';\n      apply('custom',h)\n    }else apply(b.dataset.theme)\n  }));\n  const color=document.querySelector('[data-color]'),hex=document.querySelector('[data-hex]');\n  color.addEventListener('input',()=>{hex.value=color.value.toUpperCase();apply('custom',color.value)});\n  hex.addEventListener('input',()=>{const v=hex.value.trim();if(/^#[0-9a-f]{6}$/i.test(v)){color.value=v;apply('custom',v)}});\n\n  document.querySelectorAll('[data-billing]').forEach(b=>b.addEventListener('click',()=>{\n    document.querySelectorAll('[data-billing]').forEach(x=>x.classList.remove('active'));b.classList.add('active');\n    const annual=b.dataset.billing==='annual';\n    const priceEl=document.querySelector('[data-price]');\n    priceEl.textContent=annual?'$1,290':'$129';\n    priceEl.classList.remove('price-pop');void priceEl.offsetWidth;priceEl.classList.add('price-pop');\n    document.querySelector('[data-price-sub]').textContent=annual?'/ year · $107.50/month equivalent':'/ month · billed monthly';\n  }));\n\n\n  // Reliable in-page navigation inside the embedded public landing page.\n  document.addEventListener('click',e=>{\n    const link=e.target.closest('a[href^=\"#\"]');\n    if(!link)return;\n    const href=link.getAttribute('href');\n    if(!href||href==='#')return;\n    const target=document.querySelector   function theme(){const key=state.studio.theme||'wine';const base={...(THEMES[key]||THEMES.wine)};if(key==='custom'){base.primary=state.studio.customPrimary||'#941651';base.border=base.primary;base.on=contrast(base.primary);base.secondary=mix(base.primary,'#ffffff',.78);base.bg=mix(base.primary,'#ffffff',.94);base.muted=mix(base.primary,'#777777',.58);base.previewA=mix(base.primary,'#ffffff',.9);base.previewB=mix(base.primary,'#ffffff',.82);base.previewC=mix(base.primary,'#ffffff',.96);base.previewGlow=mix(base.primary,'#ffffff',.88);base.previewSparkle=hexRgb(base.primary)}return base}
  function contrast(hex){const c=hex.replace('#','');if(c.length!==6)return '#FFFFFF';const [r,g,b]=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16));return ((r*299+g*587+b*114)/1000)>155?'#24191D':'#FFFFFF'}

  function activeTimezone(){
    const saved=state.settings?.availability?.timezone;

  }
  function zonedNowParts(timeZone=activeTimezone()){
    try{
      const parts=new Intl.DateTimeFormat('en-CA',{timeZone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
      const map=Object.fromEntries(parts.map(p=>[p.type,p.value]));

  function prettyDate(v){if(!v)return 'Date not set';const [y,m,d]=v.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d,12));return date.toLocaleDateString(undefined,{timeZone:'UTC',weekday:'short',day:'numeric',month:'short',year:'numeric'})}
  function prettyTime(v){if(!v)return 'Time not set';const [hh,mm]=v.split(':').map(Number);const d=new Date();d.setHours(hh,mm,0,0);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}

  const BOOKING_STEP_MINUTES=30;
  const BOOKING_DAY_KEYS=['sun','mon','tue','wed','thu','fri','sat'];
  function timeToMinutes(value){const [hh,mm]=String(value||'').split(':').map(Number);return Number.isFinite(hh)&&Number.isFinite(mm)?hh*60+mm:NaN}
  function minutesToTime(value){const mins=Math.max(0,Math.round(value));return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`}
  function isWorkingDate(date){if(!date)return false;const [y,m,dn]=date.split('-').map(Number);const d=new Date(Date.UTC(y,m-1,dn,12));if(Number.isNaN(d.getTime()))return false;const a=settingsPrefs().availability;return !!a.days[BOOKING_DAY_KEYS[d.getUTCDay()]]}
  function slotConflicts(date,time,excludeClientId=null){
    const candidate=timeToMinutes(time),a=settingsPrefs().availability,buffer=Math.max(0,Number(a.buffer)||0);

    return state.clients.some(c=>c.id!==excludeClientId&&c.appointmentDate===date&&c.appointmentTime&&c.status!=='CANCELLED'&&(()=>{const booked=timeToMinutes(c.appointmentTime),diff=Math.abs(candidate-booked);return Number.isFinite(booked)&&(diff===0||(buffer>0&&diff<=buffer))})());
  }
  function availableBookingSlots(date,excludeClientId=null){
    const a=settingsPrefs().availability;

  }

  function renderSignup(){
    const first=state.account.firstName,email=state.account.email,pwd=state.signupDraft.password||'',terms=state.account.terms,th=theme();
    el.innerHTML=`<main class="signup-page page-enter" style="${themeUiVars(th)}"><div class="narrow-shell"><div class="topbar">${wordmark()}<button class="btn ghost small" id="signupBack">${icon('back')} Preview</button></div><div class="signup-grid"><section style="${previewAmbience(th)}"><p class="eyebrow">Save your studio</p><h1 class="display" style="font-size:clamp(3.3rem,7vw,5.7rem)">Make it <span class="editorial" style="color:var(--wine)">yours.</span></h1><p class="body" style="font-size:1.03rem;max-width:500px;margin-top:22px">Create the account concept for this founder preview. Nothing here authenticates or leaves this HTML file.</p>${previewPhone({clientName:'Your client',service:state.studio.services.map(serviceName).join(' · '),modules:state.studio.modules,themeObj:th})}</section><section class="card form-card"><form id="signupForm" class="form-stack" novalidate><button class="google-signup" id="googleSignup" type="button"><span class="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button><div class="signup-divider"><span>or continue with email</span></div><div class="field"><label for="firstName">First name</label><input class="input" id="firstName" autocomplete="given-name" value="${h(first)}"></div><div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" value="${h(email)}"></div><div class="password-field"><label for="password">Password</label><div class="password-input-wrap"><input class="input" id="password" type="password" autocomplete="new-password" value="${h(pwd)}"><button type="button" class="password-toggle" id="passwordToggle" aria-pressed="false" aria-controls="password">Show</button></div><span class="help">At least 8 characters. This is your Rovei password, not your Google password. Stored only in memory for this preview session.</span></div><div class="consent-box" id="consentBox"><input id="terms" type="checkbox" ${terms?'checked':''}><div class="consent-copy"><label for="terms">I agree to the </label><button type="button" class="text-link-btn" id="openTerms">Terms &amp; Conditions</button><span> and </span><button type="button" class="text-link-btn" id="openPrivacy">Privacy Policy</button><span>.</span></div></div><div class="signup-validation" id="signupValidation" role="alert" aria-live="polite"></div><button class="btn full" id="signupSubmit" type="button">Save my studio ${icon('arrow')}</button><div style="background:var(--soft);border-radius:16px;padding:13px 15px;font-size:.78rem;color:var(--muted);line-height:1.55"><strong style="color:var(--text)">No payment yet.</strong> You’ll review Rovei Studio pricing next.</div></form></section></div></div></main>`;
    const signupBack=document.getElementById('signupBack');
    if(signupBack)signupBack.onclick=()=>{state.screen='preview';persist();render()};
    const googleSignup=document.getElementById('googleSignup');
    if(googleSignup)googleSignup.onclick=()=>toast('Google sign-in will connect securely when Rovei is hosted. This standalone preview does not authenticate with Google or access your Google password.');
    const firstInput=document.getElementById('firstName');
    const emailInput=document.getElementById('email');
    const pwdInput=document.getElementById('password');
    const termsInput=document.getElementById('terms');
    const consentBox=document.getElementById('consentBox');
    const validation=document.getElementById('signupValidation');
    if(!firstInput||!emailInput||!pwdInput||!termsInput||!consentBox||!validation){toast('Please refresh this preview and try again.');return;}
    const sync=()=>{state.account.firstName=firstInput.value;state.account.email=emailInput.value.trim();state.signupDraft.password=pwdInput.value;state.account.terms=termsInput.checked;persist()};
    const clearValidation=()=>{validation.classList.remove('show');validation.textContent='';consentBox.classList.remove('invalid');firstInput.classList.remove('invalid');emailInput.classList.remove('invalid');pwdInput.classList.remove('invalid')};
    const showValidation=(message,target)=>{validation.textContent=message;validation.classList.add('show');if(target==='terms')consentBox.classList.add('invalid');if(target==='first')firstInput.classList.add('invalid');if(target==='email')emailInput.classList.add('invalid');if(target==='password')pwdInput.classList.add('invalid');validation.scrollIntoView({block:'nearest'})};
    [firstInput,emailInput,pwdInput].forEach(node=>node.addEventListener('input',()=>{sync();clearValidation()}));
    termsInput.addEventListener('change',()=>{sync();clearValidation()});
    const pwdToggle=document.getElementById('passwordToggle');
    if(pwdToggle)pwdToggle.onclick=()=>{const reveal=pwdInput.type==='password';pwdInput.type=reveal?'text':'password';pwdToggle.textContent=reveal?'Hide':'Show';pwdToggle.setAttribute('aria-pressed',String(reveal));pwdInput.focus({preventScroll:true})};
    const openTerms=document.getElementById('openTerms');
    const openPrivacy=document.getElementById('openPrivacy');
    if(openTerms)openTerms.onclick=e=>{e.preventDefault();e.stopPropagation();showLegalDoc('terms',th)};
    if(openPrivacy)openPrivacy.onclick=e=>{e.preventDefault();e.stopPropagation();showLegalDoc('privacy',th)};
    const signupForm=document.getElementById('signupForm');
    const signupSubmit=document.getElementById('signupSubmit');
    if(!signupForm||!signupSubmit){toast('Please refresh this preview and try again.');return;}
    let completingSignup=false;
    const completeSignup=e=>{
      if(e?.preventDefault)e.preventDefault();
      if(completingSignup)return;
      sync();clearValidation();
      if(!state.account.terms){showValidation('Please agree to the Terms & Conditions and Privacy Policy to continue.','terms');termsInput.focus();return}
      if(!state.account.firstName.trim()){showValidation('Please enter your first name.','first');firstInput.focus();return}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.account.email)){showValidation('Please enter a valid email address.','email');emailInput.focus();return}
      if(state.signupDraft.password.length<8){showValidation('Your password must be at least 8 characters.','password');pwdInput.focus();return}
      completingSignup=true;
      signupSubmit.disabled=true;
      signupSubmit.setAttribute('aria-busy','true');
      signupSubmit.innerHTML=`Saving studio ${icon('arrow')}`;
      try{
        state.account.firstName=state.account.firstName.trim();
        state.screen='activation';
        persist();
        window.scrollTo(0,0);
        renderActivation();
      }catch(err){
        console.error('Signup transition failed',err);
        state.screen='signup';
        persist();
        completingSignup=false;
        signupSubmit.disabled=false;
        signupSubmit.removeAttribute('aria-busy');
        signupSubmit.innerHTML=`Save my studio ${icon('arrow')}`;
        showValidation('Something interrupted the preview transition. Please click Save my studio again.');
      }
    };
    signupSubmit.addEventListener('click',completeSignup);
    signupForm.addEventListener('submit',completeSignup);

  }

  const PRIORITY_TIMEZONES=[
    ['Europe/London','London · United Kingdom'],
    ['America/New_York','New York · US Eastern'],
    ['America/Chicago','Chicago · US Central'],
    ['America/Denver','Denver · US Mountain'],
    ['America/Los_Angeles','Los Angeles · US Pacific'],
    ['America/Phoenix','Phoenix · Arizona'],
    ['America/Anchorage','Anchorage · Alaska'],
    ['Pacific/Honolulu','Honolulu · Hawaii'],
    ['America/Toronto','Toronto · Canada'],
    ['Europe/Dublin','Dublin · Ireland'],
    ['Europe/Paris','Paris · Central Europe'],
    ['Europe/Berlin','Berlin · Central Europe'],
    ['Africa/Johannesburg','Johannesburg · South Africa'],
    ['Africa/Nairobi','Nairobi · East Africa'],
    ['Asia/Dubai','Dubai · UAE'],
    ['Asia/Kolkata','India'],
    ['Asia/Singapore','Singapore'],
    ['Asia/Tokyo','Tokyo · Japan'],
    ['Australia/Sydney','Sydney · Australia'],
    ['Pacific/Auckland','Auckland · New Zealand'],
    ['UTC','UTC']
  ];
  function supportedTimezones(){
    let zones=[];
    try{if(typeof Intl.supportedValuesOf==='function')zones=Intl.supportedValuesOf('timeZone')}catch(e){}
    const fallback=PRIORITY_TIMEZONES.map(([id])=>id);
    const seen=new Set();
    return [...fallback,...zones].filter(z=>z&&!seen.has(z)&&seen.add(z))
  }
  function timezoneFriendlyName(zone){
    const named=PRIORITY_TIMEZONES.find(([id])=>id===zone);
    return named?named[1]:String(zone).replace(/_/g,' ').replace('/', ' · ')
  }
  function timezoneOptions(selected){
    const priorityIds=new Set(PRIORITY_TIMEZONES.map(([id])=>id));
    const current=supportedTimezones();
    if(selected&&!current.includes(selected))current.unshift(selected);
    const popular=PRIORITY_TIMEZONES.filter(([id])=>current.includes(id));
    const rest=current.filter(id=>!priorityIds.has(id));
    const option=id=>`<option value="${h(id)}" ${selected===id?'selected':''}>${h(timezoneFriendlyName(id))}</option>`;
    return `<optgroup label="Popular">${popular.map(([id])=>option(id)).join('')}</optgroup><optgroup label="All time zones">${rest.map(option).join('')}</optgroup>`
  }

    state.settings={...defaults,...current,availability:{...defaults.availability,...(current.availability||{}),days:{...defaults.availability.days,...(current.availability?.days||{})}},notifications:{...defaults.notifications,...(current.notifications||{})}};
    return state.settings;
  }

'}${c.modules.includes('prep')?`<div class="data-row"><div class="k">Preparation guidance</div><div class="v">${r.prep?'Read and acknowledged':'—'}</div></div>`:''}${c.modules.includes('inspiration')?photoResultRow('Inspiration photos',cp.inspiration):''}${c.modules.includes('current-photos')?photoResultRow('Current photos',cp['current-photos']):''}</section>`}${visits.length?`<section class="card data-block"><p class="eyebrow">Client history</p>${visits.map(v=>visitHistory(v,c)).join('')}</section>`:''}</div><aside class="detail-side"><section class="card pad appointment-card"><p class="eyebrow">Appointment</p><div class="appointment-summary"><div class="data-row"><div class="k">Service</div><div class="v">${h(serviceName(c.service))}</div></div><div class="data-row"><div class="k">Date</div><div class="v">${h(prettyDate(c.appointmentDate))}</div></div><div class="data-row"><div class="k">Time</div><div class="v">${h(prettyTime(c.appointmentTime))}</div></div><div class="data-row"><div class="k">Status</div><div class="v">${c.status}</div></div></div>${c.status==='READY'?`<button class="btn full" id="recordVisit" style="margin-top:20px">Record visit ${icon('arrow')}</button>`:''}${c.status==='COMPLETE'?'<p class="caption" style="margin-top:15px">This preview visit is complete.</p>':''}</section></aside></div></div>`

  function renderVisit(){

esponse?.feel))}</div></div></aside></div></main></div></div>`;
    document.getElementById('visitBack').onclick=()=>{state.screen='app';state.appPage='client-detail';persist();render()};
    document.getElementById('visitSummary').addEventListener('input',e=>{state.visitDraft={summary:e.target.value};persist()});
    bindPhotoInput('beforePhotos','draft-'+c.id,'before','beforePreview',memory.visitPhotos);bindPhotoInput('afterPhotos','draft-'+c.id,'after','afterPreview',memory.visitPhotos);
    let completingVisit=false;
    const completeVisit=e=>{
      if(e?.preventDefault)e.preventDefault();
      if(completingVisit)return;
      const summaryEl=document.getElementById('visitSummary');
      const summary=summaryEl?.value.trim()||'';
      if(!summary){toast('Add a visit summary before completing.');summaryEl?.focus();return}
      const btn=document.getElementById('completeVisitBtn');

      if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true');btn.innerHTML=`Completing visit ${icon('check')}`}
      try{
        if(!Array.isArray(state.visits))state.visits=[];
        const idx=state.clients.findIndex(x=>x.id===c.id);
        if(idx<0)throw new Error('Client record could not be found.');
        const id='visit_'+Date.now().toString(36);
        const draftKey='draft-'+c.id;
        state.visits.push({id,clientId:c.id,date:todayISO(),summary});
        memory.visitPhotos[id]=memory.visitPhotos[draftKey]||{};

        toast('Could not complete the visit. Please try again.');
      }
    };
    const visitForm=document.getElementById('visitForm');
    const completeBtn=document.getElementById('completeVisitBtn');
    visitForm.addEventListener('submit',completeVisit);
    completeBtn.addEventListener('click',completeVisit);
  }

  function randomToken(len){const chars='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<len;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}

  async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
